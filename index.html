<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aplikasi Keuangan - Roudhotul Qur'an</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b5940">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginScreen" class="screen" style="display:none">
  <div class="login-box">
    <img src="icon-192.png" class="login-logo" alt="">
    <h2>Aplikasi Keuangan</h2>
    <p class="muted">Roudhotul Qur'an</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="bendahara@pprqsentol.com">
    <label for="loginPassword">Kata sandi</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Kata sandi" onkeydown="if(event.key==='Enter') doLogin()">
    <p id="loginError" class="muted" style="color:#c0392b;display:none"></p>
    <button class="btn-primary" onclick="doLogin()" id="loginBtn">Masuk</button>
  </div>
</div>

<div id="app" class="screen" style="display:none">
  <header class="topbar">
    <img src="icon-192.png" class="topbar-logo" alt="">
    <div>
      <div class="topbar-title">Aplikasi Keuangan</div>
      <div class="topbar-sub" id="syncBadge">Memuat&hellip;</div>
    </div>
    <button class="icon-btn" onclick="openSync()" title="Sinkron santri & cadangan data">&#8635;</button>
    <button class="icon-btn" onclick="doLogout()" title="Keluar">&#9211;</button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
