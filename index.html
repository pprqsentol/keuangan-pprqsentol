<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KASIR TOKO — Kasir & Saldo Anggota</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4A3B">
<meta name="description" content="Aplikasi kasir dan saldo anggota untuk toko, bekerja sepenuhnya offline.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KASIR TOKO">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F6F1E4;
    --surface:#FFFFFF;
    --primary:#2B4A3B;
    --primary-dark:#1B2F26;
    --accent:#B8862F;
    --accent-light:#EFE1BC;
    --text:#22281F;
    --muted:#6E6858;
    --border:#E2D8BE;
    --danger:#A6402F;
    --danger-light:#F3DFD9;
    --success:#3E6B4F;
    --success-light:#DCE8DF;
    --font-head:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);}
  ::selection{background:var(--accent-light);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;background:var(--primary);
    background-image:linear-gradient(180deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#EFE8D6;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .sidebar-brand{padding:24px 20px 16px;border-bottom:1px solid rgba(239,232,214,.15);}
  .sidebar-brand .title{font-family:var(--font-head);font-size:20px;letter-spacing:.5px;}
  .sidebar-brand .sub{font-size:11px;color:#C9BE9E;margin-top:2px;letter-spacing:.5px;text-transform:uppercase;}
  .nav{padding:12px;flex:1;}
  .nav button{
    display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
    color:#DCD4BA;padding:11px 12px;border-radius:8px;font-size:14px;text-align:left;margin-bottom:2px;
    transition:background .15s;
  }
  .nav button .ic{width:18px;text-align:center;opacity:.85;}
  .nav button:hover{background:rgba(239,232,214,.08);}
  .nav button.active{background:var(--accent);color:#2B2410;font-weight:600;}
  .sidebar-foot{padding:14px 16px;border-top:1px solid rgba(239,232,214,.15);font-size:11px;color:#A79E80;}

  /* Main */
  .main{flex:1;min-width:0;padding:28px 32px;max-width:1180px;}
  .page-title{font-family:var(--font-head);font-size:26px;margin:0 0 4px;}
  .page-sub{color:var(--muted);font-size:13.5px;margin:0 0 22px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;}

  /* Cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .card .value{font-family:var(--font-head);font-size:24px;margin-top:6px;color:var(--primary-dark);font-variant-numeric:tabular-nums;}
  .card.accent{background:var(--primary);color:#EFE8D6;border-color:var(--primary);}
  .card.accent .label{color:#C9BE9E;}
  .card.accent .value{color:var(--accent-light);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .panel-body{padding:16px 18px;}
  .empty{color:var(--muted);font-size:13.5px;padding:24px;text-align:center;}

  /* Buttons */
  .btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text);}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#F3EFDF;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#2B2410;font-weight:600;}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-danger{background:var(--danger-light);border-color:#E3BDB2;color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px;}
  .btn-icon{padding:6px 9px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--border);padding:9px 10px;}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF8EF;}
  .num{font-variant-numeric:tabular-nums;text-align:right;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.saldo{background:var(--success-light);color:var(--success);}
  .tag.tunai{background:var(--accent-light);color:#7A5A17;}
  .tag.low{background:var(--danger-light);color:var(--danger);}
  .tag.topup{background:#E3E9F5;color:#3B5488;}
  .tag.tarik{background:var(--danger-light);color:var(--danger);}
  .tag.batal{background:var(--border);color:var(--muted);}
  .tag.hutang{background:var(--danger-light);color:var(--danger);}
  .tag.lunas{background:var(--success-light);color:var(--success);}

  .search{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;width:220px;background:var(--surface);}
  .search:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(27,47,38,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .scan-overlay{position:fixed;inset:0;background:rgba(27,47,38,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .scan-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-head{padding:18px 20px 8px;font-family:var(--font-head);font-size:19px;}
  .modal-body{padding:8px 20px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:38px;}
  .toggle-eye{position:absolute;top:50%;right:3px;transform:translateY(-50%);background:none;border:none;padding:6px 8px;font-size:15px;line-height:1;color:var(--muted);}
  .toggle-eye:hover{color:var(--text);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .kategori-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip-kategori{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:13px;cursor:pointer;color:var(--text);transition:background .15s,border-color .15s,color .15s;}
  .chip-kategori.active{background:var(--primary-dark);border-color:var(--primary-dark);color:#F3EFDF;}
  .chart-legend{display:flex;gap:16px;margin-bottom:10px;font-size:12.5px;color:var(--muted);}
  .chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
  .chart-scroll{overflow-x:auto;}
  #grafikLaporan{display:block;}
  #grafikProdukLaporan{display:block;}

  /* Kasir layout — 2 kolom, tinggi penuh sisa layar, masing-masing bagian scroll sendiri */
  .kasir-wrap{display:grid;grid-template-columns:340px 1fr;gap:14px;min-height:0;}
  .kasir-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .kasir-col-fixed{flex:none;}
  .kasir-col-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .kasir-pembeli-blok{padding:14px 16px;border-bottom:1px solid var(--border);}
  .kasir-cart-head{padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;}
  .kasir-cart-list{padding:4px 16px;}
  /* Bar Total & pembayaran, memanjang PENUH kiri-ke-kanan (di bawah kedua kolom),
     stuck (fixed) di paling bawah LAYAR di semua perangkat — bukan cuma di satu
     kolom — supaya Total, status Lunas/Hutang & tombol Proses Transaksi selalu
     kelihatan tanpa scroll, termasuk saat address bar HP muncul/hilang. left,
     width & tinggi kolom di atasnya disetel via JS (sesuaikanTinggiKasir) supaya
     persis selebar area kasir (kolom kiri + kolom kanan). */
  .kasir-total-bar{padding:12px 16px;border:1px solid var(--border);border-bottom:none;position:fixed;bottom:0;z-index:20;background:var(--surface);border-radius:12px 12px 0 0;box-shadow:0 -8px 20px rgba(0,0,0,.10);}
  .cart-total-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px;}
  .cart-total-row .cart-total{margin:0;padding-top:0;border-top:none;flex:1 1 auto;min-width:110px;}
  .chips-bayar{flex:0 0 auto;}
  .kasir-produk-search{padding:14px 16px;border-bottom:1px solid var(--border);}
  .produk-list{display:flex;flex-direction:column;}
  .produk-row{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--border);background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%;transition:background .15s;}
  .produk-row:hover{background:var(--bg);}
  .produk-row:disabled{opacity:.4;}
  .produk-row .nm{flex:1 1 auto;min-width:80px;font-weight:600;font-size:13.5px;}
  .produk-row .nm .produk-row-sub{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px;}
  .produk-row .st{color:var(--muted);font-size:11.5px;flex:none;margin-left:auto;}
  .produk-row-besar{background:var(--accent-light);color:#7A5A17;border-radius:14px;padding:3px 10px;font-size:11px;font-weight:600;flex:none;white-space:nowrap;}
  .produk-row-besar:hover{filter:brightness(0.97);}
  .cart-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .cart-item .nm{flex:1;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-ctrl button{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--bg);line-height:1;padding:0;flex:none;}
  .qty-ctrl input{width:38px;height:22px;border-radius:5px;border:1px solid var(--border);background:#fff;text-align:center;padding:0;font-size:13px;-moz-appearance:textfield;}
  .qty-ctrl input::-webkit-outer-spin-button,.qty-ctrl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .cart-total{display:flex;justify-content:space-between;font-family:var(--font-head);font-size:19px;margin:14px 0;padding-top:12px;border-top:2px solid var(--primary-dark);}
  .nav-badge{background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 6.5px;margin-left:4px;vertical-align:2px;}

  /* Struk */
  .struk{font-family:'Courier New',monospace;font-size:12.5px;background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:16px;}
  @media print{
    body *{visibility:hidden;}
    #strukPrint, #strukPrint *{visibility:visible;}
    #strukPrint{position:absolute;top:0;left:0;width:100%;border:none;padding:0;}
  }
  .struk .center{text-align:center;}
  .struk hr{border:none;border-top:1px dashed var(--border);margin:8px 0;}
  .struk-row{display:flex;justify-content:space-between;gap:6px;}
  .struk-row-item{display:flex;justify-content:space-between;gap:6px;}
  .struk-row-item .satuan{flex:none;color:var(--muted);text-align:center;min-width:56px;}
  .struk-row-item .subtotal{flex:none;text-align:right;min-width:64px;}

  .barcode-preview{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center;}
  .barcode-preview svg{max-width:100%;height:auto;}
  .barcode-print{text-align:center;padding:6px 0 10px;}
  .input-row{display:flex;gap:6px;}
  .input-row input{flex:1;min-width:0;}
  .input-row .btn{flex-shrink:0;white-space:nowrap;}
  .mono{font-family:'Courier New',monospace;font-size:11.5px;color:var(--muted);}
  /* Kotak pratinjau kamera dibuat kecil (seukuran kotak fokus), bukan selayar —
     karena yang benar-benar dipakai untuk membaca kode cuma area kotak ini saja
     (lihat getCropRect di JS: sekarang memetakan langsung dari kotak kecil ini,
     bukan dari video mentah yang besar). object-fit:cover dipakai supaya gambar
     kamera tetap proporsional (tidak gepeng) walau kotaknya kecil & lebar tetap 100%. */
  .modal-scan{max-width:300px;}
  .scan-wrap{position:relative;border-radius:10px;overflow:hidden;background:#000;line-height:0;}
  #scanVideo{width:100%;height:180px;display:block;background:#000;object-fit:cover;}
  .scan-guide{position:absolute;inset:8px;border:2px solid var(--accent);border-radius:8px;pointer-events:none;}
  .scan-guide::before,.scan-guide::after{content:'';position:absolute;width:18px;height:18px;border-color:#fff;}
  .scan-guide .laser{position:absolute;left:4%;right:4%;height:2px;top:8%;background:linear-gradient(90deg,transparent,var(--accent) 15%,var(--accent) 85%,transparent);box-shadow:0 0 8px 1px var(--accent);animation:scanLaser 1.7s ease-in-out infinite;}
  @keyframes scanLaser{0%{top:8%;}50%{top:88%;}100%{top:8%;}}
  .scan-hint-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:10px;}
  .scan-hint-row .hint{margin:0;flex:1;}
  .panel-body{overflow-x:auto;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#F3EFDF;padding:11px 20px;border-radius:30px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .badge-count{background:var(--danger);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:10px;margin-left:auto;}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;background:var(--bg);border:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--muted);}
  .rank-badge.top1{background:#F5D67B;border-color:#D9B84E;color:#5C4413;}
  .rank-badge.top2{background:#DCE1E8;border-color:#B9C1CC;color:#3C4450;}
  .rank-badge.top3{background:#E8C7A9;border-color:#D2A67C;color:#5C3B1E;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .anggota-select-search{position:relative;}
  .dropdown-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:180px;overflow-y:auto;z-index:10;box-shadow:0 6px 16px rgba(0,0,0,.1);display:none;}
  .dropdown-list.show{display:block;}
  .dropdown-list div{padding:8px 12px;font-size:13.5px;border-bottom:1px solid var(--border);}
  .dropdown-list div:hover{background:var(--bg);}
  .dropdown-list div:last-child{border-bottom:none;}

  footer.hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  @media(max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}
    .sidebar-brand{display:none;}
    .nav{display:flex;padding:8px;}
    .nav button{white-space:nowrap;width:auto;}
    .sidebar-foot{display:none;}
    .main{padding:18px;}
    .kasir-wrap{grid-template-columns:38% 1fr;gap:10px;}
    .kasir-pembeli-blok,.kasir-produk-search{padding:10px 12px;}
    .kasir-total-bar{padding:10px 12px;}
    .kasir-cart-list{padding:4px 12px;}
    .produk-row{padding:9px 12px;}
  }
  @media(max-width:480px){
    .kasir-wrap{grid-template-columns:46% 1fr;gap:8px;}
    #btnScanProduk .lbl{display:none;}
    #btnScanProduk{padding:8px 10px;}
    .cart-total{font-size:15.5px;margin:0;}
    .cart-total-row{margin:0 0 8px;}
    .kategori-chips{gap:5px;}
    .chip-kategori{padding:6px 9px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="title">🏪 KASIR TOKO</div>
      <div class="sub">Kasir &amp; Saldo Anggota</div>
    </div>
    <nav class="nav" id="nav">
      <button data-page="dashboard" class="active"><span class="ic">▤</span> Dashboard</button>
      <button data-page="kasir"><span class="ic">🧾</span> Kasir</button>
      <button data-page="anggota"><span class="ic">👥</span> Anggota</button>
      <button data-page="produk"><span class="ic">📦</span> Produk <span id="badgeStokMenipis" class="nav-badge" style="display:none;"></span></button>
      <button data-page="riwayat"><span class="ic">🕘</span> Riwayat</button>
      <button data-page="kas"><span class="ic">💰</span> Kas</button>
      <button data-page="laporan"><span class="ic">📊</span> Laporan</button>
      <button data-page="pengaturan"><span class="ic">⚙️</span> Pengaturan</button>
      <button type="button" id="btnRefresh"><span class="ic">🔄</span> Refresh</button>
      <button type="button" id="btnLogout"><span class="ic">🚪</span> Logout</button>
    </nav>
    <div id="badgeAntrean" onclick="bukaAntreanDetail()" style="display:none;margin:10px 14px 0;padding:8px 10px;border-radius:8px;background:#fff3cd;color:#7a5b00;font-size:12px;font-weight:600;text-align:center;cursor:pointer;"></div>
    <div class="sidebar-foot">Tersimpan lokal di perangkat ini.<br>Bekerja tanpa koneksi internet.</div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="scan-overlay" id="scanOverlay"><div class="modal modal-scan" id="scanModal"></div></div>
<div class="toast" id="toast"></div>

<script>

/* ============ SUPABASE ============
   Dipakai untuk: login (Produk & Laporan), dan sinkron data (produk, transaksi
   toko, saldo santri) dengan database bersama Pondok/Keuangan. */
const SUPABASE_URL = 'https://hvivddbhacoppkbtiqpe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BTFxSTrt1vM1seoQaXG_7g_mqYo5aqq';

/* ============ INDEXEDDB HELPER ============
   Pengganti localStorage: kapasitas jauh lebih besar (ratusan MB, bukan ~5-10MB) dan
   baca/tulisnya tidak nge-blok tampilan (async), jadi auto-save tidak bikin aplikasi macet
   sesaat walau data transaksi sudah banyak. Ditulis manual pakai IndexedDB API bawaan
   browser (tanpa library luar) supaya aplikasi tetap 100% offline seperti sebelumnya. */
const IDB_NAME = 'warungPondokDB';
const IDB_STORE = 'kv';
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB tidak didukung di browser ini')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _idbPromise;
}
function idbGet(key){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbSet(key, value){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  }));
}

/* ============ STORAGE LAYER ============ */
const DB_KEY = 'warungPondokData_v1';
const AUTH_KEY = 'warungPondokAuth_v1';
const AUTO_BACKUP_KEY = 'warungPondokAutoBackup_v1';

// Migrasi sekali jalan: kalau perangkat ini masih punya data lama di localStorage
// (dari versi aplikasi sebelum pindah ke IndexedDB), pindahkan otomatis lalu hapus yang lama.
async function migrasiDariLocalStorage(){
  try{
    const sudahAdaDiIdb = await idbGet(DB_KEY);
    if(sudahAdaDiIdb) return; // sudah pernah pakai IndexedDB di perangkat ini, tidak perlu migrasi lagi
    const migrasiSatuKey = async (key)=>{
      const raw = localStorage.getItem(key);
      if(!raw) return;
      try{ await idbSet(key, JSON.parse(raw)); localStorage.removeItem(key); }
      catch(e){ console.error('Gagal migrasi data lama untuk', key, e); }
    };
    await migrasiSatuKey(DB_KEY);
    await migrasiSatuKey(AUTH_KEY);
    await migrasiSatuKey(AUTO_BACKUP_KEY);
  }catch(e){ console.error('Gagal memeriksa migrasi data lama', e); }
}

function bentukAwalState(){
  return {
    anggota:[], produk:[], transaksi:[], riwayatBarcode:{}, kasAwal:0, modalAwal:0, kasMutasi:[],
    // Cache hasil tarik-balik dari Supabase — dipakai sebagai "sumber kebenaran" untuk Dashboard/Kas/Laporan
    // supaya angkanya selalu selaras dengan aplikasi lain (Pondok dll), dan sekaligus jadi cadangan aman
    // andai HP hilang/direset (lihat tarikTransaksiTokoDariSupabase, sinkronRingkasanToko, sinkronTransaksiItemToko).
    transaksiTokoCache: [], // replika riwayat transaksi_toko (+item) dari server, per lokasi
    transaksiItemCache: [], // replika baris v_transaksi_item (per produk terjual) dari server, per lokasi
    ringkasanToko: null // replika 1 baris v_ringkasan_toko (kas/modal/laba kumulatif) untuk lokasi ini
  };
}
async function loadDB(){
  try{
    const data = await idbGet(DB_KEY);
    if(data){
      // Jaga-jaga data lama (sebelum fitur cache Supabase ini ada) belum punya field-field baru ini.
      if(!data.transaksiTokoCache) data.transaksiTokoCache = [];
      if(!data.transaksiItemCache) data.transaksiItemCache = [];
      if(data.ringkasanToko === undefined) data.ringkasanToko = null;
      return data;
    }
  }catch(e){ console.error('Gagal membaca data', e); }
  return bentukAwalState();
}
function saveDB(){
  // Ditulis async (fire-and-forget) supaya tidak nge-blok UI seperti localStorage dulu;
  // `state` di memori sudah ter-update duluan jadi tampilan tetap langsung responsif.
  idbSet(DB_KEY, state).catch(e=>{ console.error('Gagal menyimpan data', e); toast('Gagal menyimpan data — cek penyimpanan perangkat'); });
  perbaruiBadgeStokMenipis();
}
function perbaruiBadgeStokMenipis(){
  const badge = document.getElementById('badgeStokMenipis');
  if(!badge) return;
  const jumlah = state.produk.filter(p=>p.stok<=5).length;
  if(jumlah > 0){ badge.textContent = jumlah; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }
}

/* ============ LOKASI TOKO (per device) ============ */
const LOKASI_KEY = 'lokasiToko_v1';
let lokasiToko = 'Pondok';
async function muatLokasiToko(){
  try{ lokasiToko = (await idbGet(LOKASI_KEY)) || 'Pondok'; }catch(e){ lokasiToko = 'Pondok'; }
}
function ubahLokasiToko(v){
  lokasiToko = v;
  idbSet(LOKASI_KEY, v).catch(e=>console.error('Gagal menyimpan lokasi toko', e));
  toast(`Lokasi diubah ke Toko ${v} — memuat ulang produk lokasi ini...`);
  muatProdukDariSupabase().then(()=>{ if(document.querySelector('.nav button[data-page="produk"].active')) renderPage('produk'); });
}

/* ============ SINKRON DATA SANTRI (dari Aplikasi Pondok, read-only) ============ */
const LIMIT_BELANJA_DEFAULT = 10000;
function mapSantriDariSupabase(r, saldoMap, limitMap){
  return {
    id: r.id, nama: r.nama, kamar: r.kamar || '', nomorInduk: r.no_induk || '',
    saldo: saldoMap[r.id] || 0,
    limitHarian: (limitMap[r.id]!==undefined) ? limitMap[r.id] : LIMIT_BELANJA_DEFAULT
  };
}
async function muatSantriDariSupabase(){
  if(!navigator.onLine) return false;
  // Penting: JANGAN timpa saldo santri lokal kalau masih ada tiket transaksi yang menunggu
  // dikirim — data dari server saat ini belum tentu memasukkan transaksi yang belum sinkron itu,
  // jadi menimpa saldo di sini bisa membuat saldo tampil lebih besar dari yang sebenarnya
  // (santri bisa dianggap punya saldo cukup padahal sebenarnya sudah dipakai transaksi yang
  // masih tertunda) — berisiko kasir "menjual dobel" dari saldo yang sama.
  if(antrean.length > 0) return false;
  const [{ data: santriRows, error: errSantri }, { data: saldoRows, error: errSaldo }, { data: limitRows, error: errLimit }] = await Promise.all([
    sb.from('santri').select('id,nama,no_induk,kamar').eq('aktif', true).order('nama'),
    sb.from('saldo_santri').select('santri_id,saldo'),
    sb.from('limit_belanja_santri').select('santri_id,limit_harian')
  ]);
  if(errSantri || errSaldo){ console.error('Gagal memuat santri/saldo', errSantri||errSaldo); return false; }
  if(errLimit) console.error('Gagal memuat limit belanja, pakai default', errLimit);
  const saldoMap = {};
  (saldoRows||[]).forEach(r=>{ saldoMap[r.santri_id] = Number(r.saldo)||0; });
  const limitMap = {};
  (limitRows||[]).forEach(r=>{ limitMap[r.santri_id] = Number(r.limit_harian); });
  state.anggota = (santriRows||[]).map(r=>mapSantriDariSupabase(r, saldoMap, limitMap));
  saveDB();
  return true;
}
// Total belanja pakai saldo hari ini (waktu lokal perangkat), dipakai untuk cek limit belanja
// harian. Dihitung dari transaksi yang tersimpan lokal (toko cuma 1 titik/perangkat, jadi data
// lokal sudah mencakup semua transaksi hari ini di toko ini).
function belanjaSaldoHariIniSantri(santriId){
  const hariIni = tanggalLokal(new Date());
  return state.transaksi
    .filter(t => t.tipe==='jual' && t.metode==='saldo' && t.anggotaId===santriId && tanggalLokal(new Date(t.tanggal))===hariIni)
    .reduce((s,t)=>s+t.total, 0);
}

/* ============ ANTREAN SINKRON (LOCAL-FIRST) ============
   Prinsip: setiap perubahan data (produk baru, transaksi, dll) LANGSUNG diterapkan ke
   `state` & disimpan ke IndexedDB dulu (jadi UI selalu responsif & tetap jalan walau
   offline). Perubahan itu JUGA dicatat sebagai satu "tiket" di antrean. Begitu ada
   koneksi internet, tiket-tiket itu dikirim ke Supabase satu-satu SESUAI URUTAN
   terjadinya, supaya data yang saling bergantung (misal produk baru dulu, baru
   transaksi yang jual produk itu) tetap benar urutannya. */
const ANTREAN_KEY = 'antreanSinkron_v1';
const ANTREAN_GAGAL_KEY = 'antreanGagal_v1';
const MAKS_PERCOBAAN = 5; // setelah gagal sekian kali (bukan sekadar offline), pindahkan ke "Gagal" supaya tidak menyumbat antrean tiket lain
let antrean = [];
let antreanGagal = [];
let sedangSinkron = false;

async function muatAntrean(){
  try{ antrean = (await idbGet(ANTREAN_KEY)) || []; }catch(e){ antrean = []; }
  try{ antreanGagal = (await idbGet(ANTREAN_GAGAL_KEY)) || []; }catch(e){ antreanGagal = []; }
}
function simpanAntrean(){
  idbSet(ANTREAN_KEY, antrean).catch(e=>console.error('Gagal menyimpan antrean', e));
  perbaruiBadgeAntrean();
}
function simpanAntreanGagal(){
  idbSet(ANTREAN_GAGAL_KEY, antreanGagal).catch(e=>console.error('Gagal menyimpan antrean gagal', e));
  perbaruiBadgeAntrean();
}
function tambahTiketAntrean(tipe, payload){
  antrean.push({ id: uid('tkt'), tipe, payload, dibuatPada: new Date().toISOString(), percobaan: 0 });
  simpanAntrean();
  cobaSinkronSekarang();
}
// Label ringkas per tiket, dipakai di badge & modal detail antrean supaya pengguna awam paham data apa yang dimaksud.
function labelTiket(tiket){
  const p = tiket.payload || {};
  if(tiket.tipe === 'produk_baru') return `Produk baru: ${p.nama||'-'}`;
  if(tiket.tipe === 'produk_edit') return `Edit produk: ${p.nama||'-'}`;
  if(tiket.tipe === 'produk_hapus') return `Hapus produk`;
  if(tiket.tipe === 'transaksi_toko') return `Transaksi ${p.metode||''} ${p.items?rupiah(p.items.reduce((s,it)=>s+(it.harga_jual||0)*(it.qty||0),0)):''}`.trim();
  if(tiket.tipe === 'kas_mutasi_baru') return `Kas ${p.arah==='masuk'?'masuk':'keluar'}: ${labelKategoriKas(p.arah,p.kategori)} ${rupiah(p.jumlah||0)}`;
  if(tiket.tipe === 'kas_mutasi_hapus') return `Hapus catatan kas`;
  if(tiket.tipe === 'kas_awal_update') return `Update kas awal: ${rupiah(p.kasAwal||0)}`;
  if(tiket.tipe === 'transaksi_batal') return `Batalkan transaksi`;
  if(tiket.tipe === 'transaksi_lunas') return `Tandai lunas hutang`;
  return tiket.tipe;
}
function perbaruiBadgeAntrean(){
  const badge = document.getElementById('badgeAntrean');
  if(!badge) return;
  if(antrean.length === 0 && antreanGagal.length === 0){
    badge.style.display = 'none';
    return;
  }
  badge.style.display = '';
  if(antreanGagal.length > 0){
    badge.style.background = '#f8d7da';
    badge.style.color = '#842029';
    const sisa = antrean.length > 0 ? `, ${antrean.length} masih menunggu` : '';
    badge.textContent = `⚠️ ${antreanGagal.length} data gagal terkirim${sisa} — ketuk untuk lihat`;
  } else {
    badge.style.background = '#fff3cd';
    badge.style.color = '#7a5b00';
    badge.textContent = navigator.onLine
      ? `🔄 Menyinkronkan ${antrean.length} data... (ketuk untuk lihat)`
      : `🔌 Offline — ${antrean.length} data menunggu dikirim (ketuk untuk lihat)`;
  }
}

async function cobaSinkronSekarang(){
  if(sedangSinkron || !navigator.onLine || antrean.length === 0) { perbaruiBadgeAntrean(); return; }
  sedangSinkron = true;
  perbaruiBadgeAntrean();
  while(antrean.length > 0 && navigator.onLine){
    const tiket = antrean[0];
    try{
      await prosesTiket(tiket);
      antrean.shift();
      simpanAntrean();
    }catch(e){
      console.error('Gagal sinkron tiket', tiket, e);
      tiket.percobaan = (tiket.percobaan||0) + 1;
      tiket.pesanError = (e && (e.message || e.error_description || e.hint)) || String(e);
      if(tiket.percobaan >= MAKS_PERCOBAAN){
        // Sudah dicoba berkali-kali dan tetap gagal (bukan sekadar offline) — kemungkinan besar
        // datanya bermasalah (mis. ditolak server), bukan cuma koneksi. Pindahkan ke daftar "Gagal"
        // supaya TIDAK menyumbat tiket-tiket lain di belakangnya yang mungkin justru valid.
        antrean.shift();
        antreanGagal.push(tiket);
        simpanAntrean();
        simpanAntreanGagal();
        toast(`⚠️ 1 data gagal disinkronkan setelah dicoba ${MAKS_PERCOBAAN}x — cek Antrean untuk detail`);
        continue; // lanjut coba tiket berikutnya, jangan berhenti total
      } else {
        simpanAntrean();
        break; // masih dalam batas percobaan — berhenti dulu, jangan lompati urutan, coba lagi nanti
      }
    }
  }
  sedangSinkron = false;
  // Antrean baru saja habis (semua tiket sukses terkirim, atau sisanya dipindah ke "Gagal") —
  // saatnya tarik ulang data produk & santri dari server, karena muatProdukDariSupabase /
  // muatSantriDariSupabase sengaja menolak menimpa data lokal selama antrean masih ada isinya.
  if(antrean.length === 0 && navigator.onLine){
    muatProdukDariSupabase().then(()=>{ if(document.querySelector('.nav button[data-page="produk"].active')) renderPage('produk'); });
    muatSantriDariSupabase();
    muatKasDariSupabase().then(()=>{ if(document.querySelector('.nav button[data-page="kas"].active')) renderPage('kas'); });
    sinkronRingkasanDanRiwayatToko();
  }
  perbaruiBadgeAntrean();
}

/* ============ DETAIL ANTREAN (untuk pengguna) ============
   Modal sederhana supaya pengguna toko bisa lihat data apa saja yang masih menunggu dikirim
   atau yang gagal terkirim, dan bisa coba lagi / hapus tiket yang gagal secara manual. */
function bukaAntreanDetail(){
  const baris = (list, gagal)=> list.map(t=>`
    <div style="border:1px solid var(--border,#e2e2e2);border-radius:8px;padding:8px 10px;margin-bottom:8px;">
      <div style="font-size:13px;font-weight:600;">${labelTiket(t)}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${new Date(t.dibuatPada).toLocaleString('id-ID')}${t.percobaan?` · dicoba ${t.percobaan}x`:''}</div>
      ${gagal && t.pesanError ? `<div style="font-size:11.5px;color:#b02a37;margin-top:4px;">Pesan server: ${escapeHtml(t.pesanError)}</div>` : ''}
      ${gagal ? `
        <div style="margin-top:6px;display:flex;gap:6px;">
          <button class="btn btn-sm" onclick="cobaLagiTiketGagal('${t.id}')">🔄 Coba lagi</button>
          <button class="btn btn-sm" onclick="hapusTiketGagal('${t.id}')">🗑️ Hapus (batal kirim)</button>
        </div>` : ''}
    </div>
  `).join('');
  openModal(`
    <div class="modal-head">Antrean Sinkron ke Server</div>
    <div class="modal-body">
      ${antreanGagal.length > 0 ? `
        <p style="font-size:12.5px;color:#842029;margin-top:0;">Data di bawah ini sudah dicoba dikirim ${MAKS_PERCOBAAN}x tapi tetap ditolak/gagal — data tetap tersimpan di HP ini. Coba lagi kalau kira-kira sebabnya sudah beres (mis. koneksi), atau Hapus kalau memang tidak jadi dikirim.</p>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <strong style="font-size:13px;">Gagal terkirim (${antreanGagal.length})</strong>
          <button class="btn btn-sm" onclick="cobaSemuaGagal()">🔄 Coba semua lagi</button>
        </div>
        ${baris(antreanGagal, true)}
      ` : ''}
      ${antrean.length > 0 ? `
        <strong style="font-size:13px;">Menunggu dikirim (${antrean.length})</strong>
        <p style="font-size:12px;color:var(--muted);margin-top:2px;">Dikirim otomatis satu-satu sesuai urutan begitu ada koneksi internet.</p>
        ${baris(antrean, false)}
      ` : ''}
      ${antreanGagal.length===0 && antrean.length===0 ? `<p style="font-size:13px;color:var(--muted);">Tidak ada data yang menunggu.</p>` : ''}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Tutup</button></div>
    </div>
  `);
}
function cobaLagiTiketGagal(id){
  const idx = antreanGagal.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const [tiket] = antreanGagal.splice(idx,1);
  tiket.percobaan = 0;
  tiket.pesanError = null;
  antrean.unshift(tiket); // taruh di depan supaya urutan asli tetap terjaga
  simpanAntrean();
  simpanAntreanGagal();
  bukaAntreanDetail();
  cobaSinkronSekarang();
}
function hapusTiketGagal(id){
  if(!confirm('Hapus data ini dari antrean? Perubahan ini TIDAK akan pernah dikirim ke server.')) return;
  antreanGagal = antreanGagal.filter(t=>t.id!==id);
  simpanAntreanGagal();
  bukaAntreanDetail();
}
function cobaSemuaGagal(){
  if(antreanGagal.length === 0) return;
  const dipindah = antreanGagal.map(t=>({...t, percobaan:0, pesanError:null}));
  antreanGagal = [];
  antrean = [...dipindah, ...antrean]; // urutan asli (lama dulu) tetap di depan
  simpanAntrean();
  simpanAntreanGagal();
  closeModal();
  cobaSinkronSekarang();
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function prosesTiket(tiket){
  if(tiket.tipe === 'produk_baru'){
    const { data, error } = await sb.from('produk').insert(mapProdukKeSupabase(tiket.payload)).select().single();
    if(error) throw error;
    // Tukar id sementara (dibuat offline) dengan id asli dari server, di semua tempat yang mungkin memakainya
    tukarIdProdukSementara(tiket.payload.id, data.id);
  } else if(tiket.tipe === 'produk_edit'){
    const idAsli = idProdukAsli(tiket.payload.id);
    const { error } = await sb.from('produk').update(mapProdukKeSupabase(tiket.payload)).eq('id', idAsli);
    if(error) throw error;
  } else if(tiket.tipe === 'produk_hapus'){
    const idAsli = idProdukAsli(tiket.payload.id);
    if(!String(idAsli).startsWith('prd_')){ // kalau masih id sementara (belum sempat sinkron sama sekali), tidak perlu hapus di server
      const { error } = await sb.from('produk').delete().eq('id', idAsli);
      if(error) throw error;
    }
  } else if(tiket.tipe === 'kas_mutasi_baru'){
    const { error } = await sb.from('kas_mutasi').insert(mapKasMutasiKeSupabase(tiket.payload));
    if(error) throw error;
  } else if(tiket.tipe === 'kas_mutasi_hapus'){
    const { error } = await sb.from('kas_mutasi').delete().eq('id', tiket.payload.id);
    if(error) throw error;
  } else if(tiket.tipe === 'kas_awal_update'){
    const { error } = await sb.from('pengaturan_kas').upsert({
      lokasi: tiket.payload.lokasi,
      kas_awal: tiket.payload.kasAwal,
      modal_awal: tiket.payload.modalAwal,
      updated_oleh: tiket.payload.dicatatOleh
    });
    if(error) throw error;
  } else if(tiket.tipe === 'transaksi_toko'){
    const p = tiket.payload;
    const dariAntreanOffline = true; // tiket antrean SELALU berarti ini pengiriman belakangan, bukan saat itu juga
    // Penting: id produk di tiap item BARU diterjemahkan ke id asli Supabase di sini, saat
    // benar-benar akan dikirim — bukan saat tiket ini dibuat. Kalau produknya juga baru dibuat
    // offline (masih id sementara "prd_xxx" saat transaksi ini terjadi), tiket "produk_baru"-nya
    // pasti sudah diproses lebih dulu (urutan antrean FIFO) sehingga idProdukAsli() di sini sudah
    // tahu id asli dari server. Kalau langsung diterjemahkan sejak awal, id sementara yang lama
    // akan "membeku" di payload dan gagal terkirim (id itu tidak pernah ada di server).
    const itemsUntukServer = p.items.map(it=>({
      produk_id: idProdukAsli(it.produkIdLokal != null ? it.produkIdLokal : it.produk_id),
      nama_produk: it.nama_produk, harga_jual: it.harga_jual, harga_beli: it.harga_beli, qty: it.qty
    }));
    const { data: idHasil, error } = await sb.rpc('belanja_toko', {
      p_santri_id: p.santriId,
      p_metode: p.metode,
      p_items: itemsUntukServer,
      p_lokasi: p.lokasi,
      p_catatan: p.catatan,
      p_dicatat_oleh: p.dicatatOleh,
      p_client_id: p.clientId,
      p_dari_antrean_offline: dariAntreanOffline
    });
    if(error) throw error;
    // Cek hasil akhirnya di server (bisa saja server ubah dari Saldo -> Hutang kalau ternyata saldo kurang)
    const { data: rowAsli } = await sb.from('transaksi_toko').select('metode,status_bayar').eq('id', idHasil).single();
    const trxLokal = state.transaksi.find(t=>t.clientId===p.clientId);
    if(trxLokal && rowAsli){
      trxLokal.idServer = idHasil;
      if(rowAsli.metode === 'Hutang' && trxLokal.metode !== 'hutang'){
        trxLokal.metode = 'hutang';
        trxLokal.statusBayar = 'belum_bayar';
        trxLokal.catatan = (trxLokal.catatan||'') + ' (otomatis jadi hutang: saldo ternyata kurang saat sinkron)';
        saveDB();
        if(document.getElementById('tabelRiwayatWrap')) renderTabelRiwayat();
      }
    }
  } else if(tiket.tipe === 'transaksi_batal'){
    // Kirim pembatalan ke server lewat RPC batalkan_transaksi_toko, pakai client_id (bukan id server)
    // supaya tetap jalan walau tiket 'transaksi_toko' aslinya belum sempat terkirim saat tiket batal ini
    // dibuat — asal urutan antrean FIFO, tiket pembuatannya pasti diproses duluan, jadi saat tiket batal
    // ini giliran jalan, baris transaksi_toko-nya (dicari via client_id) sudah pasti ada di server.
    const { error } = await sb.rpc('batalkan_transaksi_toko', { p_client_id: tiket.payload.clientId });
    if(error) throw error;
  } else if(tiket.tipe === 'transaksi_lunas'){
    // lunaskan_transaksi_toko butuh id ASLI (uuid) dari server, bukan client_id — cari dulu baris
    // aslinya lewat client_id (sama alasannya seperti transaksi_batal: urutan antrean FIFO menjamin
    // tiket 'transaksi_toko' baris ini sudah terkirim lebih dulu, jadi client_id ini pasti sudah ada).
    const { data: row, error: e1 } = await sb.from('transaksi_toko').select('id').eq('client_id', tiket.payload.clientId).single();
    if(e1) throw e1;
    const { error: e2 } = await sb.rpc('lunaskan_transaksi_toko', { p_id: row.id });
    if(e2) throw e2;
  }
}

// Peta id sementara (dibuat offline, format "prd_xxx") -> id asli dari Supabase (uuid),
// supaya tiket-tiket berikutnya yang menyebut id sementara itu tetap nyambung ke baris yang benar.
let petaIdProduk = {};
function idProdukAsli(id){ return petaIdProduk[id] || id; }
function tukarIdProdukSementara(idSementara, idAsli){
  petaIdProduk[idSementara] = idAsli;
  const p = state.produk.find(x=>x.id===idSementara);
  if(p) p.id = idAsli;
  saveDB();
}
function mapProdukKeSupabase(p){
  return {
    nama: p.nama, kategori: p.kategori||null, barcode: p.barcode||null,
    harga_beli: p.hargaBeli||0, harga_jual: p.harga||0, stok: p.stok||0,
    harga_grosir: p.hargaGrosir||null, qty_grosir: p.qtyGrosir||null,
    nama_satuan_besar: p.namaSatuanBesar||null, isi_satuan_besar: p.isiSatuanBesar||null,
    harga_satuan_besar: p.hargaSatuanBesar||null, lokasi: lokasiToko
  };
}

/* ============ SINKRON KAS (KAS AWAL, MODAL AWAL, MUTASI KAS) DENGAN SUPABASE ============
   Id yang dipakai di baris kas_mutasi SENGAJA sama persis dengan id lokal (uid('kas')) —
   jadi tidak perlu peta id sementara -> id asli seperti pada produk. */
function mapKasMutasiKeSupabase(m){
  return {
    id: m.id, lokasi: m.lokasi || lokasiToko, tanggal: m.tanggal, arah: m.arah,
    kategori: m.kategori, jumlah: m.jumlah, catatan: m.catatan || null,
    dicatat_oleh: m.dicatatOleh || null
  };
}
function mapKasMutasiDariSupabase(r){
  return { id: r.id, lokasi: r.lokasi, tanggal: r.tanggal, arah: r.arah, kategori: r.kategori, jumlah: Number(r.jumlah)||0, catatan: r.catatan || '' };
}
// Tarik kas_mutasi & pengaturan_kas (kas awal/modal awal) dari server dan GABUNGKAN ke data lokal
// (bukan menimpa total) — supaya baris yang sudah ada di HP lain / sebelum fitur ini ada tetap aman,
// dan restorasi di HP baru / sesudah data lokal hilang tetap bisa menarik riwayat dari server.
async function muatKasDariSupabase(){
  if(!navigator.onLine) return false;
  if(antrean.length > 0) return false; // sama seperti produk/santri: jangan tarik selama masih ada tiket kas yang menunggu dikirim
  try{
    const [{ data: mutasiRows, error: errMutasi }, { data: pengaturanRow, error: errPengaturan }] = await Promise.all([
      sb.from('kas_mutasi').select('*').eq('lokasi', lokasiToko),
      sb.from('pengaturan_kas').select('kas_awal,modal_awal').eq('lokasi', lokasiToko).maybeSingle()
    ]);
    if(errMutasi || errPengaturan){ console.error('Gagal memuat data kas dari Supabase', errMutasi||errPengaturan); return false; }
    const idLokalYangAda = new Set(state.kasMutasi.map(m=>m.id));
    (mutasiRows||[]).forEach(r=>{
      if(!idLokalYangAda.has(r.id)) state.kasMutasi.push(mapKasMutasiDariSupabase(r));
    });
    if(pengaturanRow){
      state.kasAwal = Number(pengaturanRow.kas_awal)||0;
      state.modalAwal = Number(pengaturanRow.modal_awal)||0;
    }
    saveDB();
    return true;
  }catch(e){ console.error('Gagal memuat data kas dari Supabase', e); return false; }
}

/* ============ TARIK-BALIK RIWAYAT transaksi_toko KE INDEXEDDB ============
   Tujuan: (1) cadangan aman kalau HP hilang/direset — begitu login lagi di HP baru, riwayat
   transaksi toko bisa ditarik ulang dari server, bukan cuma mengandalkan IndexedDB lokal yang hilang;
   (2) jadi "sumber kebenaran" untuk Kas & Dashboard (lihat daftarTransaksiToko) supaya konsisten
   dengan data yang dilihat aplikasi lain (mis. panel Laporan Toko di Aplikasi Pondok).
   PENTING: tabel transaksi_toko TIDAK punya tabel item terpisah — rincian barang disimpan langsung
   di kolom items (jsonb) pada baris yang sama, dan kolom tanggalnya bernama created_at (bukan
   "tanggal"), serta tidak ada kolom santri_nama (nama santri didapat lewat join ke tabel santri
   kalau santri_id terisi; kalau tidak, pakai catatan — dipakai untuk pembeli non-santri). */
function mapTransaksiTokoDariSupabase(r){
  return {
    id: r.id, clientId: r.client_id || null, tipe:'jual', tanggal: r.created_at, lokasi: r.lokasi,
    anggotaId: r.santri_id || null, anggotaNama: (r.santri && r.santri.nama) || r.catatan || null,
    metode: r.metode==='Saldo' ? 'saldo' : r.metode==='Hutang' ? 'hutang' : 'tunai',
    statusBayar: r.status_bayar || (r.metode==='Hutang' ? 'belum_bayar' : 'lunas'),
    total: Number(r.total)||0,
    dibatalkan: !!r.dibatalkan, dibatalkanPada: r.dibatalkan_pada || null, lunasPada: r.lunas_pada || null,
    catatan: r.catatan || null, dicatatOleh: r.dicatat_oleh || null,
    items: (r.items||[]).map(it=>({
      produkId: it.produk_id, nama: it.nama_produk, harga: Number(it.harga_jual)||0,
      hargaBeli: Number(it.harga_beli)||0, qty: Number(it.qty)||0
    })),
    dariServer: true
  };
}
async function tarikTransaksiTokoDariSupabase(){
  if(!navigator.onLine) return false;
  if(antrean.length > 0) return false; // sama seperti data lain: jangan timpa cache selama masih ada tiket yang menunggu dikirim

    const { data: headerRows, error: errHeader } = await sb.from('transaksi_toko')
      .select('*, santri:santri_id(nama)').eq('lokasi', lokasiToko).order('created_at', { ascending:false }).limit(3000);
    if(errHeader){ console.error('Gagal menarik riwayat transaksi_toko', errHeader); return false; }

async function sinkronRingkasanToko(){

// Gabungkan cache resmi dari server dengan transaksi lokal yang BARU dibuat tapi belum sempat
// tersinkron (clientId-nya belum ada di cache) — supaya Dashboard/Kas/Laporan tetap akurat detik itu
// juga walau baru saja transaksi & belum online, tapi begitu sudah tersinkron otomatis pakai data
// server (satu sumber kebenaran, selaras dengan aplikasi lain).
function daftarTransaksiToko(){
  const cache = state.transaksiTokoCache || [];
  const localByClientId = {};
  state.transaksi.forEach(t=>{ if(t.tipe==='jual' && t.clientId) localByClientId[t.clientId] = t; });
  // "Tandai Lunas" & "Batalkan" belum ada tiket sinkronnya ke server (murni lokal) — kalau catatan lokal
  // beda dari cache untuk baris yang sama, catatan lokal yang menang supaya statusnya tidak "kebalik"
  // ke keadaan lama begitu cache dari server ditarik ulang.
  const hasil = cache.map(t=>{
    const lokal = t.clientId ? localByClientId[t.clientId] : null;
    if(lokal && (lokal.dibatalkan !== t.dibatalkan || lokal.statusBayar !== t.statusBayar)){
      return { ...t, dibatalkan: lokal.dibatalkan, dibatalkanPada: lokal.dibatalkanPada, statusBayar: lokal.statusBayar, lunasPada: lokal.lunasPada };
    }
    return t;
  });
  const idClientDiCache = new Set(cache.map(t=>t.clientId).filter(Boolean));
  const belumSinkron = state.transaksi.filter(t=> t.tipe==='jual' && !idClientDiCache.has(t.clientId));
  return [...hasil, ...belumSinkron];
}
function daftarItemTransaksiToko(){
  const cache = state.transaksiItemCache || [];
  const localByClientId = {};
  state.transaksi.forEach(t=>{ if(t.tipe==='jual' && t.clientId) localByClientId[t.clientId] = t; });
  // Sama seperti daftarTransaksiToko: status batal/lunas belum disinkron ke server, jadi catatan
  // lokal (kalau ada & beda) yang dipakai untuk baris item dari cache milik transaksi yang sama.
  const hasil = cache.map(i=>{
    const lokal = i.transaksiClientId ? localByClientId[i.transaksiClientId] : null;
    if(lokal && (lokal.dibatalkan !== i.dibatalkan || lokal.statusBayar !== i.statusBayar)){
      return { ...i, dibatalkan: !!lokal.dibatalkan, statusBayar: lokal.statusBayar };
    }
    return i;
  });
  const idDiCache = new Set(cache.map(x=>x.transaksiClientId).filter(Boolean));
  const itemBelumSinkron = [];
  state.transaksi.forEach(t=>{
    if(t.tipe!=='jual' || idDiCache.has(t.clientId)) return;
    t.items.forEach(i=>{
      itemBelumSinkron.push({
        transaksiId:null, transaksiClientId: t.clientId, tanggal:t.tanggal, lokasi:t.lokasi||lokasiToko,
        metode:t.metode, statusBayar:t.statusBayar, dibatalkan: !!t.dibatalkan,
        produkId:i.produkId, namaProduk:i.nama, hargaJual:i.harga, hargaBeli:i.hargaBeli||0,
        qty: i.qty*(i.pcsPerSatuan||1)
      });
    });
  });
  return [...hasil, ...itemBelumSinkron];
}
// Cache v_ringkasan_toko dianggap "siap pakai" hanya kalau sudah pernah ditarik DAN tidak ada tiket
// yang masih menunggu dikirim (kalau masih ada antrean, angka di server belum termasuk perubahan itu).
function cacheRingkasanSiapPakai(){

}

// Semua halaman kini wajib login. Dibagi 2 kelompok:
// 1) Dashboard, Kasir, Anggota, Produk — dipakai untuk operasional harian (transaksi jual-beli),
//    jadi cukup login SEKALI per sesi (buka salah satu dari keempatnya akan minta login kalau
//    sesi belum masuk, lalu ketiganya yang lain otomatis ikut terbuka tanpa tanya lagi).
// 2) Riwayat, Kas, Laporan, Pengaturan — berisi data lebih sensitif (riwayat transaksi &
//    pembatalan, arus kas warung, laporan omzet/laba, dan cadangkan/pulihkan/hapus data),
//    jadi minta login ULANG SETIAP KALI diklik meskipun sesi yang di atas sudah masuk.
const HALAMAN_TERKUNCI = ['dashboard','kasir','anggota','produk','riwayat','kas','laporan','pengaturan'];
const HALAMAN_TERKUNCI_SETIAP_KLIK = ['riwayat','kas','laporan','pengaturan'];

let lastAuthEmail = ''; // cuma buat prefill kolom email biar tidak ketik ulang tiap kali, tidak disimpan permanen
function mintaLogin(onSuccess, setiapKlik){
  const infoSesi = setiapKlik
    ? 'Menu ini minta login ulang setiap kali dibuka, demi keamanan data.'
    : 'Login ini berlaku untuk sesi ini — setelah masuk, Dashboard, Kasir, Anggota, dan Produk tidak akan minta login lagi sampai aplikasi ditutup/dimuat ulang.';
  openModal(`
    <div class="modal-head">🔒 Masuk</div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted);margin-top:0;">Menu ini perlu login (akun dari admin pusat) dan koneksi internet. ${infoSesi}</p>
      <div class="field"><label>Email</label><input id="authEmail" type="email" value="${lastAuthEmail}" autocomplete="username"></div>
      ${fieldPassword('authPass', 'Password', 'current-password')}
      <p id="authError" style="color:#c0392b;font-size:12.5px;margin:-4px 0 10px;display:none;"></p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" id="btnAuthSubmit">Masuk</button>
      </div>
    </div>
  `);
  setTimeout(()=>{ const el = document.getElementById(lastAuthEmail ? 'authPass' : 'authEmail'); if(el) el.focus(); }, 50);
  const tampilkanError = (msg)=>{ const e = document.getElementById('authError'); if(e){ e.textContent = msg; e.style.display = 'block'; } };
  const submit = async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const p = document.getElementById('authPass').value;
    if(!email || !p){ tampilkanError('Email & password wajib diisi'); return; }
    const btn = document.getElementById('btnAuthSubmit');
    btn.disabled = true; btn.textContent = 'Memeriksa...';
    const { error } = await sb.auth.signInWithPassword({ email, password: p });
    btn.disabled = false; btn.textContent = 'Masuk';
    if(error){
      tampilkanError('Email/password salah, atau sedang tidak ada koneksi internet.');
      return;
    }
    lastAuthEmail = email;
    sesiMasuk = true;
    closeModal();
    // PENTING: begitu login berhasil, sesi Supabase baru saja berubah dari anon -> authenticated.
    // Kalau ada data (kas_mutasi/pengaturan_kas/ringkasan/dll) yang tadinya gagal ditarik diam-diam
    // saat masih anon (RLS menolak), state lokal masih 0/kosong walau sekarang sudah login.
    // Tarik ulang semuanya dulu sebelum merender halaman yang diminta, supaya angkanya langsung benar
    // — bukan menunggu tombol Refresh ditekan manual.
    if(navigator.onLine){
      toast('Menyinkronkan data...');
      await Promise.all([
        muatProdukDariSupabase(),
        muatSantriDariSupabase(),
        muatKasDariSupabase(),
        sinkronRingkasanDanRiwayatToko()
      ]);
    }
    onSuccess && onSuccess();
  };
  document.getElementById('btnAuthSubmit').addEventListener('click', submit);
  ['authEmail','authPass'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  });
}

/* ============ FORMAT TITIK RIBUAN UNTUK INPUT ANGKA (harga, nominal, dsb) ============ */
function formatRibuan(val){
  const bersih = (val||'').toString().replace(/[^\d]/g,'');
  if(!bersih) return '';
  return parseInt(bersih,10).toLocaleString('id-ID');
}
function angkaSaja(val){
  const bersih = (val||'').toString().replace(/[^\d]/g,'');
  return bersih ? parseInt(bersih,10) : 0;
}
function attachFormatRibuan(id, onAfter){
  const el = document.getElementById(id);
  if(!el) return;
  if(el.value) el.value = formatRibuan(el.value);
  el.addEventListener('input', ()=>{
    const posDariBelakang = el.value.length - el.selectionStart;
    el.value = formatRibuan(el.value);
    const posBaru = el.value.length - posDariBelakang;
    el.selectionStart = el.selectionEnd = Math.max(0, posBaru);
    if(onAfter) onAfter();
  });
}

/* ============ KODE QR KARTU ANGGOTA — pakai engine qrcode-generator di atas, tetap 100% offline ============ */
function generateQRSVG(text, opts){
  opts = opts || {};
  const cellSize = opts.cellSize || 4;
  const clean = (text||'').trim();
  if(!clean) return '<span style="color:var(--muted);font-size:12px;">Isi nomor induk untuk melihat kode QR</span>';
  try{
    const qr = qrcode(0, opts.ecLevel || 'M'); // 0 = pilih ukuran QR otomatis sesuai panjang teks
    qr.addData(clean);
    qr.make();
    return qr.createSvgTag({ cellSize: cellSize, margin: cellSize });
  }catch(e){
    return '<span style="color:var(--muted);font-size:12px;">Gagal membuat kode QR</span>';
  }
}
function todayStr(d){ d = d || new Date(); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }

function tagTipeTransaksi(t){
  let tag;
  if(t.tipe==='topup') tag = '<span class="tag topup">Top Up</span>';
  else if(t.tipe==='tarik') tag = '<span class="tag tarik">Tarik Tunai</span>';
  else if(t.metode==='hutang') tag = t.statusBayar==='lunas' ? '<span class="tag lunas">Hutang · Lunas</span>' : '<span class="tag hutang">Hutang · Belum Bayar</span>';
  else tag = t.metode==='saldo' ? '<span class="tag saldo">Saldo</span>' : '<span class="tag tunai">Tunai</span>';
  if(t.dibatalkan) tag += ' <span class="tag batal">Dibatalkan</span>';
  return tag;
}

}

  window.scrollTo(0,0);
  // ==== Riwayat browser utk tombol kembali HP (lihat blok BACK BUTTON di bawah) ====
  // Cuma dicatat kalau ini benar-benar pindah halaman (bukan render ulang halaman yg sama),
  // dan bukan hasil reaksi dari popstate (tombol kembali) itu sendiri — supaya tidak dobel.
  if(!sedangProsesTombolKembali && halamanSebelumnya && halamanSebelumnya !== name){
    if(name === 'dashboard'){
      if(history.state && history.state.layer === 'tab') history.back();
      else history.replaceState({layer:'dashboard'}, '');
    } else if(!history.state || history.state.layer !== 'tab'){
      history.pushState({layer:'tab'}, '');
    }
    // kalau sudah di layer 'tab' dan pindah antar tab lain (mis. Kasir -> Produk),
    // tidak perlu push baru — kembali dari tab manapun tetap langsung ke Dashboard.
  }
}

/* ============ MODAL HELPERS (form/dialog utama) ============ */
function openModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  if(!sedangProsesTombolKembali) history.pushState({layer:'modal'}, '');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modal').innerHTML = '';
  if(!sedangProsesTombolKembali && history.state && history.state.layer === 'modal'){
    // Penutupan ini dipicu dari kode (tombol/aksi), bukan tombol kembali HP.
    // Tandai dulu supaya popstate yg muncul akibat history.back() di bawah ini
    // cuma dikonsumsi diam-diam, tidak ikut menutup lapisan lain di baliknya.
    sedangTutupOtomatis = true;
    history.back();
  }
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id === 'overlay') closeModal();
});

/* ============ MODAL KHUSUS SCAN KAMERA — overlay terpisah agar TIDAK menghapus modal/form yang sedang terbuka di baliknya (mis. form Tambah Produk) ============ */
function openScanModal(html){
  document.getElementById('scanModal').innerHTML = html;
  document.getElementById('scanOverlay').classList.add('show');
  if(!sedangProsesTombolKembali) history.pushState({layer:'scan'}, '');
}
function closeScanModal(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  document.getElementById('scanOverlay').classList.remove('show');
  document.getElementById('scanModal').innerHTML = '';
  if(!sedangProsesTombolKembali && history.state && history.state.layer === 'scan'){
    // Sama seperti closeModal(): ini penutupan programatik (mis. scan berhasil),
    // bukan tombol kembali HP — tandai supaya popstate-nya tidak ikut menutup
    // modal/tab di baliknya (mis. form Tambah Produk atau tab Kasir).
    sedangTutupOtomatis = true;
    history.back();
  }
}
document.getElementById('scanOverlay').addEventListener('click', e=>{
  if(e.target.id === 'scanOverlay') closeScanModal();
});

/* ============ TOMBOL KEMBALI HP (hardware/gesture back) ============
   Tanpa ini, browser/WebView tidak punya riwayat internal utk di-"pop", jadi tombol
   kembali langsung menutup aplikasi dari halaman manapun. Urutan yg dibuat di sini:
     1) Kalau scanner kamera sedang terbuka -> tutup scanner saja.
     2) Kalau tidak, kalau modal/dialog sedang terbuka -> tutup modal saja.
     3) Kalau tidak, kalau sedang di tab selain Dashboard -> pindah ke Dashboard.
     4) Kalau sudah di Dashboard tanpa apa pun terbuka -> biarkan browser keluar dari aplikasi.
   Setiap kali membuka modal/scan/tab, satu entri riwayat ditambahkan (lihat fungsi open*
   & renderPage di atas); setiap kali ditutup lewat tombol UI (bukan tombol kembali),
   entri itu ikut "dikonsumsi" lewat history.back() supaya riwayat tidak menumpuk. */
let sedangProsesTombolKembali = false;
// true sesaat setelah closeModal()/closeScanModal() memanggil history.back() sendiri
// (penutupan programatik: klik tombol, atau scan barcode/QR berhasil) — dipakai supaya
// popstate akibat pemanggilan itu cuma "dikonsumsi" tanpa memicu penutupan lapisan lain.
let sedangTutupOtomatis = false;
history.replaceState({layer:'dashboard'}, '');
window.addEventListener('popstate', ()=>{
  if(sedangTutupOtomatis){
    // UI sudah ditutup duluan oleh closeModal()/closeScanModal() yang memicu ini;
    // riwayat sudah otomatis mundur satu langkah, tidak perlu diproses lagi.
    sedangTutupOtomatis = false;
    return;
  }
  sedangProsesTombolKembali = true;
  try{
    if(document.getElementById('scanOverlay').classList.contains('show')){
      closeScanModal();
    } else if(document.getElementById('overlay').classList.contains('show')){
      closeModal();
    } else {
      const halamanAktif = document.querySelector('.nav button.active')?.dataset.page;
      if(halamanAktif && halamanAktif !== 'dashboard'){
        renderPage('dashboard');
      }
      // Kalau sudah di dashboard & tidak ada apa pun terbuka: tidak ada lagi yg perlu
      // ditutup di dalam aplikasi, jadi biarkan (browser/WebView akan keluar aplikasi
      // di tekanan tombol kembali berikutnya, karena riwayat sudah habis).
    }
  } finally {
    sedangProsesTombolKembali = false;
  }
});

/* ============ SCAN KAMERA — pakai BarcodeDetector bawaan Chrome, tanpa library luar ============ */
let scanStream = null;
let scanRAF = null;
async function openCameraScan(onDetect, opts){
  opts = opts || {};
  const continuous = !!opts.continuous;
  const judul = opts.title || 'Scan Barcode';
  const supported = 'BarcodeDetector' in window;
  openScanModal(`
    <div class="modal-head">${judul}</div>
    <div class="modal-body">
      ${supported ? `
        <div class="scan-wrap">
          <video id="scanVideo" autoplay playsinline muted></video>
          <div class="scan-guide"><div class="laser"></div></div>
        </div>
        <div class="scan-hint-row">
          <p class="hint">${continuous ? 'Arahkan tiap barcode satu-satu — otomatis masuk ke keranjang. Tekan Selesai kalau sudah beres.' : 'Posisikan barcode di dalam kotak, sejajar dan mengisi lebar kotak, hingga terbaca otomatis.'}</p>
          <button type="button" class="btn btn-sm" id="btnTorch" style="display:none;">🔦 Lampu</button>
        </div>
        ${continuous ? `<p style="font-size:12.5px;color:var(--muted);margin:8px 0 0;">Barang terscan: <strong id="scanContinuousCount">0</strong></p>` : ''}
      ` : `
        <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Kamera browser ini tidak mendukung pemindaian barcode. Gunakan alat scanner Bluetooth/USB (terbaca otomatis di kolom input), atau isi kode secara manual.</p>
      `}
      <div class="modal-actions">
        <button class="btn ${continuous?'btn-primary':''}" onclick="closeScanModal()">${supported ? (continuous ? 'Selesai' : 'Batal') : 'Tutup'}</button>
      </div>
    </div>
  `);
  if(!supported) return;
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });
    const video = document.getElementById('scanVideo');
    if(!video) return;
    video.srcObject = scanStream;
    await video.play().catch(()=>{});

    // Coba aktifkan fokus kontinu & siapkan tombol lampu senter bila kamera mendukung
    const [track] = scanStream.getVideoTracks();
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(caps.focusMode && caps.focusMode.includes('continuous')){
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
    }
    if(caps.torch){
      const btnTorch = document.getElementById('btnTorch');
      let torchOn = false;
      btnTorch.style.display = 'inline-flex';
      btnTorch.addEventListener('click', ()=>{
        torchOn = !torchOn;
        track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(()=>{});
        btnTorch.textContent = torchOn ? '🔦 Matikan' : '🔦 Lampu';
      });
    }

    // Format yang relevan saja (kartu anggota QR + barcode kemasan produk umum) agar deteksi lebih cepat & akurat
    let detector;
    try{
      detector = new BarcodeDetector({ formats: ['qr_code','code_39','code_128','ean_13','ean_8','upc_a','upc_e','codabar','itf'] });
    }catch(e){
      detector = new BarcodeDetector();
    }

    const cropCanvas = document.createElement('canvas');
    const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

    // Kotak pratinjau kamera sekarang dibuat kecil (seukuran kotak fokus) lewat CSS
    // object-fit:cover, jadi yang benar-benar TERLIHAT di layar itulah yang harus
    // dipetakan ke piksel asli video (bukan seluruh frame video mentah yang lebih
    // besar) — supaya area yang dibaca kamera tetap PERSIS sama dengan apa yang
    // dilihat pengguna di kotak kecil itu, sama seperti perilaku CSS object-fit:cover.
    function getCropRect(){
      if(!video.videoWidth || !video.videoHeight) return null;
      const vRect = video.getBoundingClientRect();
      if(!vRect.width || !vRect.height) return null;
      const scale = Math.max(vRect.width / video.videoWidth, vRect.height / video.videoHeight);
      const sw = Math.min(video.videoWidth, vRect.width / scale);
      const sh = Math.min(video.videoHeight, vRect.height / scale);
      const sx = Math.max(0, (video.videoWidth - sw) / 2);
      const sy = Math.max(0, (video.videoHeight - sh) / 2);
      return { sx, sy, sw, sh };
    }

    let busy = false;
    let lastCode = null, lastTime = 0, jumlahTerscan = 0;
    const tick = async ()=>{
      if(!scanStream) return;
      if(!busy && video.videoWidth){
        busy = true;
        try{
          const rect = getCropRect();
          if(rect && rect.sw > 0 && rect.sh > 0){
            cropCanvas.width = rect.sw;
            cropCanvas.height = rect.sh;
            cropCtx.drawImage(video, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, rect.sw, rect.sh);
            const codes = await detector.detect(cropCanvas);
            if(codes && codes.length){
              const value = codes[0].rawValue;
              const now = Date.now();
              const duplikat = continuous && value === lastCode && (now - lastTime) < 1500;
              if(!duplikat){
                lastCode = value; lastTime = now;
                if(navigator.vibrate) navigator.vibrate(70);
                if(continuous){
                  jumlahTerscan++;
                  const counterEl = document.getElementById('scanContinuousCount');
                  if(counterEl) counterEl.textContent = jumlahTerscan;
                  onDetect(value);
                  // kamera tetap terbuka untuk scan barang berikutnya
                } else {
                  closeScanModal();
                  onDetect(value);
                  busy = false;
                  return;
                }
              }
            }
          }
        }catch(e){ /* frame belum siap, coba lagi */ }
        busy = false;
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    toast('Tidak bisa mengakses kamera — cek izin kamera di browser');
    closeScanModal();
  }
}

// Hitung produk paling laris sepanjang waktu (berdasar jumlah terjual), dipakai untuk panel Top 10 di Dashboard.
function hitungProdukTerlaris(limit){
  const map = {};
  daftarItemTransaksiToko().forEach(i=>{
    if(i.dibatalkan) return;
    const key = i.produkId || i.namaProduk;
    if(!map[key]) map[key] = { nama:i.namaProduk, qty:0, omzet:0 };
    map[key].qty += i.qty;
    map[key].omzet += i.hargaJual*i.qty;
  });
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0, limit || 10);
}

function exportKartuAnggota(id){
  const a = state.anggota.find(x=>x.id===id); if(!a || !a.nomorInduk) return;
  const svgEl = document.querySelector('#barcodeBesar svg');
  if(!svgEl){ toast('Kode QR belum siap'); return; }
  const svgW = parseFloat(svgEl.getAttribute('width')) || 320;
  const svgH = parseFloat(svgEl.getAttribute('height')) || 90;
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const svgUrl = URL.createObjectURL(new Blob([svgData], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = ()=>{
    const scale = 3;
    const padX = 24, headH = a.kamar ? 64 : 46;
    const canvas = document.createElement('canvas');
    canvas.width = (svgW + padX*2) * scale;
    canvas.height = (svgH + headH + 20) * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#22281F';
    ctx.font = "bold 18px Georgia, 'Iowan Old Style', serif";
    ctx.fillText(a.nama, (svgW+padX*2)/2, 26);
    if(a.kamar){
      ctx.font = "12.5px sans-serif";
      ctx.fillStyle = '#6E6858';
      ctx.fillText(a.kamar, (svgW+padX*2)/2, 44);
    }
    ctx.drawImage(img, padX, headH-8, svgW, svgH);
    URL.revokeObjectURL(svgUrl);
    canvas.toBlob(blob=>{
      if(!blob){ toast('Gagal membuat gambar kartu'); return; }
      const dl = document.createElement('a');
      dl.href = URL.createObjectURL(blob);
      dl.download = `kartu-qr-${a.nomorInduk}.png`;
      dl.click();
      URL.revokeObjectURL(dl.href);
      toast('Gambar kartu diunduh');
    }, 'image/png');
  };
  img.onerror = ()=>{ URL.revokeObjectURL(svgUrl); toast('Gagal membuat gambar kartu'); };
  img.src = svgUrl;
}

          <option value="harian">Harian</option>
          <option value="mingguan">Mingguan</option>
          <option value="bulanan">Bulanan</option>
        </select>
        <span id="riwInputWrap"><input type="date" class="search" id="riwTanggal" value="${todayISO()}"></span>
      </div>
      <div id="riwAnggotaWrap"></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Tutup</button></div>
    </div>
  `);
  document.getElementById('riwTanggal').addEventListener('change', renderRiwayatAnggota);
  renderRiwayatAnggota();
}
function gantiPeriodeRiwayatAnggota(){
  const periode = document.getElementById('riwPeriode').value;
  const wrap = document.getElementById('riwInputWrap');
  wrap.innerHTML = periode==='bulanan'
    ? `<input type="month" class="search" id="riwTanggal" value="${todayISO().slice(0,7)}">`
    : `<input type="date" class="search" id="riwTanggal" value="${todayISO()}">`;
  document.getElementById('riwTanggal').addEventListener('change', renderRiwayatAnggota);
  renderRiwayatAnggota();
}
function renderRiwayatAnggota(){
  const id = riwayatAnggotaId;
  const a = state.anggota.find(x=>x.id===id); if(!a) return;
  const periode = document.getElementById('riwPeriode').value;
  const tglVal = document.getElementById('riwTanggal').value;
  if(!tglVal) return;
  let dari, sampai;
  if(periode==='harian'){ dari = tglVal; sampai = tglVal; }
  else if(periode==='mingguan'){ ({dari, sampai} = rangeMinggu(tglVal)); }
  else { ({dari, sampai} = rangeBulan(tglVal)); }
  const list = state.transaksi.filter(t=> t.anggotaId===id && tanggalLokal(new Date(t.tanggal))>=dari && tanggalLokal(new Date(t.tanggal))<=sampai).slice().reverse();
  const totalBelanja = list.filter(t=>t.tipe==='jual' && !t.dibatalkan).reduce((s,t)=>s+t.total,0);
  const totalTopup = list.filter(t=>t.tipe==='topup' && !t.dibatalkan).reduce((s,t)=>s+t.total,0);
  const totalTarik = list.filter(t=>t.tipe==='tarik' && !t.dibatalkan).reduce((s,t)=>s+t.total,0);
  const labelRentang = dari===sampai
    ? new Date(dari).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})
    : `${new Date(dari).toLocaleDateString('id-ID',{day:'2-digit',month:'short'})} — ${new Date(sampai).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}`;
  const wrap = document.getElementById('riwAnggotaWrap');
  wrap.innerHTML = `
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">${labelRentang}</p>
    <div class="cards" style="margin-bottom:12px;">
      <div class="card"><div class="label">Belanja</div><div class="value">${rupiah(totalBelanja)}</div></div>
      <div class="card"><div class="label">Top Up</div><div class="value" style="color:var(--success);">${rupiah(totalTopup)}</div></div>
      <div class="card"><div class="label">Tarik Tunai</div><div class="value" style="color:var(--danger);">${rupiah(totalTarik)}</div></div>
    </div>
    ${list.length ? `<table><thead><tr><th>Waktu</th><th>Detail</th><th>Tipe</th><th class="num">Total</th></tr></thead><tbody>
      ${list.map(t=>`<tr style="${t.dibatalkan?'opacity:.55;':''}">
        <td>${new Date(t.tanggal).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        <td style="color:var(--muted);font-size:12.5px;">${(t.tipe==='topup'||t.tipe==='tarik') ? (t.catatan||'-') : t.items.map(i=>`${i.nama} ${labelItemQty(i)}`).join(', ')}</td>
        <td>${tagTipeTransaksi(t)}</td>
        <td class="num">${rupiah(t.total)}</td>
      </tr>`).join('')}
    </tbody></table>` : `<div class="empty">Tidak ada transaksi pada periode ini.</div>`}
  `;
}

/* ============ KATEGORI PRODUK: tombol pilihan (chip), tanpa perlu ketik manual ============ */
const KATEGORI_PRESET = ['Makanan','Minuman','Kosmetik','Perlengkapan Mandi','ATK','Aksesoris'];

function renderKategoriField(selected){
  const sel = (selected||'').trim();
  const cocok = KATEGORI_PRESET.find(o=>o.toLowerCase()===sel.toLowerCase());
  const chipsHtml = KATEGORI_PRESET.map(o=>`<button type="button" class="chip-kategori ${cocok && o===cocok ? 'active':''}" data-val="${o}" onclick="pilihKategoriChip(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')
    + `<button type="button" class="chip-kategori ${sel && !cocok ? 'active':''}" data-val="__custom__" onclick="pilihKategoriChip(this,'__custom__')">Lainnya</button>`;
  return `
  <div class="field">
    <label>Kategori</label>
    <div class="kategori-chips" id="kategoriChips">${chipsHtml}</div>
    <input type="hidden" id="fKategori" value="${cocok ? cocok : (sel ? sel.replace(/"/g,'&quot;') : '')}">
    <input id="fKategoriLain" type="text" placeholder="Tulis nama kategori" oninput="document.getElementById('fKategori').value=this.value.trim()" style="margin-top:8px;${(sel && !cocok) ? '' : 'display:none;'}" value="${(sel && !cocok) ? sel.replace(/"/g,'&quot;') : ''}">
  </div>`;
}
function pilihKategoriChip(btnEl, val){
  const wrap = document.getElementById('kategoriChips');
  const hidden = document.getElementById('fKategori');
  const lain = document.getElementById('fKategoriLain');
  if(!wrap || !hidden) return;
  wrap.querySelectorAll('.chip-kategori').forEach(b=>b.classList.remove('active'));
  btnEl.classList.add('active');
  if(val === '__custom__'){
    hidden.value = lain ? lain.value.trim() : '';
    if(lain){ lain.style.display = 'block'; lain.value=''; lain.focus(); hidden.value=''; }
  } else {
    hidden.value = val;
    if(lain){ lain.style.display = 'none'; lain.value = ''; }
  }
}
function getKategoriValue(){
  const hidden = document.getElementById('fKategori');
  return hidden ? hidden.value.trim() : '';
}
function setKategoriValue(nilai){
  const val = (nilai||'').trim();
  const wrap = document.getElementById('kategoriChips');
  const hidden = document.getElementById('fKategori');
  const lain = document.getElementById('fKategoriLain');
  if(!wrap || !hidden || !val) return;
  wrap.querySelectorAll('.chip-kategori').forEach(b=>b.classList.remove('active'));
  const preset = KATEGORI_PRESET.find(k=>k.toLowerCase()===val.toLowerCase());
  if(preset){
    const btn = wrap.querySelector(`.chip-kategori[data-val="${preset}"]`);
    if(btn) btn.classList.add('active');
    hidden.value = preset;
    if(lain){ lain.style.display = 'none'; lain.value = ''; }
  } else {
    const btn = wrap.querySelector('.chip-kategori[data-val="__custom__"]');
    if(btn) btn.classList.add('active');
    hidden.value = val;
    if(lain){ lain.style.display = 'block'; lain.value = val; }
  }
}

function tebakKategoriDariTeks(teks){
  const t = (teks||'').toLowerCase();
  const mapping = [
    { kategori:'Minuman', kw:['minuman','drink','beverage','juice','jus','kopi','coffee','teh ','teh,','the ','soda','susu','milk','air mineral','mineral water',' water','sirup','sirop'] },
    { kategori:'Perlengkapan Mandi', kw:['sabun','soap','shampo','shampoo','sampo','pasta gigi','toothpaste','sikat gigi','odol','deterjen','hair care','conditioner','pembersih lantai','pewangi'] },
    { kategori:'Kosmetik', kw:['kosmetik','cosmetic','makeup','make up','lipstik','bedak','skincare','perawatan wajah','parfum','wangi','lotion','handbody'] },
    { kategori:'ATK', kw:['pulpen','pensil','ballpoint','buku tulis','stationery','stationary','alat tulis','penggaris','penghapus'] },
    { kategori:'Aksesoris', kw:['aksesoris','accessory','gelang','kalung','anting','jam tangan','case hp','aksesori'] },
    { kategori:'Makanan', kw:['makanan','food','snack','biscuit','biskuit','mie','noodle','chip','keripik','permen','candy','coklat','chocolate','roti','bread','bumbu','saus','sauce','beras','rice','kerupuk','kue'] },
  ];
  for(const m of mapping){
    if(m.kw.some(k=>t.includes(k))) return m.kategori;
  }
  return '';
}
async function lookupProdukBarcode(barcode){
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json?fields=product_name,brands,categories`);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.status !== 1 || !data.product) return null;
    const p = data.product;
    let nama = (p.product_name || '').trim();
    if(!nama && p.brands) nama = p.brands.split(',')[0].trim();
    if(!nama) return null;
    let kategoriMentah = '';
    if(p.categories){
      const first = p.categories.split(',')[0].trim();
      kategoriMentah = first.replace(/^[a-z]{2}:/i,'');
    }
    const kategori = tebakKategoriDariTeks(kategoriMentah + ' ' + nama) || kategoriMentah;
    return { nama, kategori };
  }catch(e){
    return null; // offline atau API tidak terjangkau — biarkan diisi manual
  }
}
function scanBarcodeProduk(){
  openCameraScan(async (kode)=>{
    const barcodeEl = document.getElementById('fBarcode');
    if(barcodeEl) barcodeEl.value = kode;
    const existing = state.produk.find(p=>p.barcode===kode);
    if(existing){

      return;
    }
    // Kode barcode langsung tersimpan di kolom, apa pun hasil pencarian berikutnya
    toast(`Kode barcode tersimpan: ${kode}`);
    const namaEl = document.getElementById('fNama');

    // 1) Cek dulu riwayat lokal di HP ini (pernah diisi manual sebelumnya) — jalan tanpa internet
    const cache = state.riwayatBarcode[kode];
    if(cache){
      if(namaEl && !namaEl.value.trim()) namaEl.value = cache.nama;
      if(cache.kategori && !getKategoriValue()) setKategoriValue(cache.kategori);
      toast(`Terisi otomatis dari riwayat: ${cache.nama}`);
      return;
    }

    // 2) Kalau belum ada di riwayat lokal, coba cari online (opsional, tidak wajib berhasil)
    const info = await lookupProdukBarcode(kode);
    if(info){
      if(namaEl && !namaEl.value.trim()) namaEl.value = info.nama;
      if(info.kategori && !getKategoriValue()) setKategoriValue(info.kategori);
      toast(`Terisi otomatis: ${info.nama}`);
    } else if(namaEl && !namaEl.value.trim()){

      // Fokuskan ke nama agar tinggal diketik manual sekali saja; scan berikutnya untuk barcode yang sama akan otomatis terisi.
      setTimeout(()=>namaEl.focus(),50);
    }
  });
}
