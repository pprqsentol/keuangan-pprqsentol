// Menyetel tinggi kolom kasir supaya pas mengisi sisa layar (di bawah topbar/sidebar),
// sehingga bagian atas (pembeli) & bawah (total/bayar) stuck, dan tengah/kanan scroll sendiri.
// Kalau tinggi layar terlalu pendek (mis. HP landscape / keyboard virtual muncul) untuk
// menampung semua bagian tetap + sedikit baris keranjang, jangan dipaksa muat — biarkan
// wrap lebih tinggi dari layar (halaman jadi bisa discroll) supaya Keranjang & tombol
// Proses Transaksi tidak pernah hilang/ketutup sama sekali.
function sesuaikanTinggiKasir(){
  const wrap = document.getElementById('kasirWrap');
  const totalBar = document.getElementById('kasirTotalBar');
  if(!wrap) return;
  // Set dulu left & width bar Total (posisinya tidak tergantung tinggi wrap) —
  // memanjang PENUH dari kolom keranjang sampai kolom produk, biar tinggi bar
  // terukur pas dengan lebar yang benar sebelum dipakai menghitung sisa ruang di atasnya.
  // Bar-nya sendiri position:fixed di CSS supaya benar-benar stuck di paling bawah
  // LAYAR (bukan cuma satu kolom) di semua perangkat.
  if(totalBar){
    const rectWrap = wrap.getBoundingClientRect();
    totalBar.style.left = rectWrap.left + 'px';
    totalBar.style.width = rectWrap.width + 'px';
  }
  const pembeliBlok = wrap.querySelector('.kasir-pembeli-blok');
  const cartHead = wrap.querySelector('.kasir-cart-head');
  const produkSearch = wrap.querySelector('.kasir-produk-search');
  const MIN_CART_LIST = 90;   // minimal separuh-baris keranjang tetap kelihatan
  const MIN_PRODUK_LIST = 70; // minimal beberapa baris produk tetap kelihatan
  const tinggiBar = totalBar ? totalBar.offsetHeight : 0;
  const tinggiTetapKiri = (pembeliBlok?pembeliBlok.offsetHeight:0) + (cartHead?cartHead.offsetHeight:0);
  const tinggiTetapKanan = produkSearch ? produkSearch.offsetHeight : 0;
  const minButuh = Math.max(tinggiTetapKiri + MIN_CART_LIST, tinggiTetapKanan + MIN_PRODUK_LIST, 200);
  const top = wrap.getBoundingClientRect().top;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  // Sisakan ruang persis setinggi bar Total di bawah, supaya kolom keranjang & produk
  // berhenti tepat di atas bar, bukan ketutupan olehnya.
  const tersedia = vh - top - 20 - tinggiBar;
  wrap.style.height = Math.max(tersedia, minButuh) + 'px';
}

// Harga efektif per pcs: otomatis pakai harga grosir kalau qty sudah mencapai ambang minimal.
function hargaEfektifPcs(p, qty){

// Total pcs yang sudah dipakai di keranjang untuk 1 produk, dijumlahkan dari SEMUA baris (satuan pcs maupun satuan besar).
function totalPcsDipakaiDiKeranjang(produkId){
  return cart.filter(c=>c.produkId===produkId).reduce((s,c)=>s+c.qty*c.pcsPerSatuan,0);
}
function tambahKeKeranjang(produkId, satuan){
  satuan = satuan || 'pcs';
  const p = state.produk.find(x=>x.id===produkId); if(!p) return;
  const pcsPerSatuan = satuan==='besar' ? (p.isiSatuanBesar||1) : 1;
  const key = produkId + (satuan==='besar' ? '__besar' : '');
  const existing = cart.find(c=>c.key===key);
  const pcsDipakaiSekarang = totalPcsDipakaiDiKeranjang(produkId);
  if(pcsDipakaiSekarang + pcsPerSatuan > p.stok){ toast('Stok tidak cukup'); return; }
  if(existing){ existing.qty++; }
  else {
    cart.push({ key, produkId: p.id, nama: p.nama, satuan, satuanLabel: satuan==='besar' ? p.namaSatuanBesar : '', pcsPerSatuan, qty: 1, harga: satuan==='besar' ? p.hargaSatuanBesar : p.harga, hargaBeli: (p.hargaBeli||0)*pcsPerSatuan });
  }
  renderCart();
  focusScanKasir();
}

function ubahQty(key, delta){
  const item = cart.find(c=>c.key===key); if(!item) return;
  const p = state.produk.find(x=>x.id===item.produkId);
  const newQty = item.qty + delta;
  if(newQty <= 0){ cart = cart.filter(c=>c.key!==key); renderCart(); return; }
  if(p){
    const pcsDipakaiLain = totalPcsDipakaiDiKeranjang(item.produkId) - item.qty*item.pcsPerSatuan;
    if(pcsDipakaiLain + newQty*item.pcsPerSatuan > p.stok){ toast('Stok tidak cukup'); return; }
  }
  item.qty = newQty;
  if(p && item.satuan==='pcs') item.harga = hargaEfektifPcs(p, item.qty);
  renderCart();
}
function setQty(key, value){
  const item = cart.find(c=>c.key===key); if(!item) return;
  const p = state.produk.find(x=>x.id===item.produkId);
  let newQty = parseInt(String(value).replace(/[^0-9]/g,''), 10);
  if(!newQty || newQty <= 0){ cart = cart.filter(c=>c.key!==key); renderCart(); return; }
  if(p){
    const pcsDipakaiLain = totalPcsDipakaiDiKeranjang(item.produkId) - item.qty*item.pcsPerSatuan;
    const maksSatuan = Math.floor((p.stok - pcsDipakaiLain) / item.pcsPerSatuan);
    if(newQty > maksSatuan){ toast('Stok tidak cukup, maksimal ' + maksSatuan); newQty = maksSatuan; }
  }
  if(newQty <= 0){ cart = cart.filter(c=>c.key!==key); renderCart(); return; }
  item.qty = newQty;
  if(p && item.satuan==='pcs') item.harga = hargaEfektifPcs(p, item.qty);
  renderCart();
}

function updateSisaKasir(){
  const sisaEl = document.getElementById('cartSisa');
  const bayarEl = document.getElementById('fBayar');
  if(!sisaEl || !bayarEl) return;
  const total = cart.reduce((s,c)=>s+c.harga*c.qty,0);
  const bayar = angkaSaja(bayarEl.value);
  const sisa = bayar - total;
  if(!bayarEl.value){ sisaEl.textContent = 'Rp0'; sisaEl.style.color = ''; return; }
  if(sisa < 0){
    sisaEl.textContent = `Kurang ${rupiah(Math.abs(sisa))}`;
    sisaEl.style.color = 'var(--danger)';
  } else {
    sisaEl.textContent = rupiah(sisa);
    sisaEl.style.color = 'var(--success)';
  }
}
function prosesTransaksi(){
  if(!cart.length) return;
  const total = cart.reduce((s,c)=>s+c.harga*c.qty,0);
  let anggota = null;
  let metode = 'tunai';
  let statusBayar = 'lunas';
  let bayar = total;
  let kembalian = 0;
  let namaPembeliHutang = null;
  if(kasirAnggotaId){
    anggota = state.anggota.find(x=>x.id===kasirAnggotaId);
    if(!anggota){ toast('Anggota tidak ditemukan'); return; }
    if(anggota.saldo < total){ toast('Saldo anggota tidak cukup, gunakan tunai atau top up dulu'); return; }
    const limitHarian = (anggota.limitHarian!==undefined) ? anggota.limitHarian : LIMIT_BELANJA_DEFAULT;
    const sudahBelanjaHariIni = belanjaSaldoHariIniSantri(anggota.id);
    if(sudahBelanjaHariIni + total > limitHarian){
      toast(`Limit belanja harian tercapai (limit ${rupiah(limitHarian)}, sudah ${rupiah(sudahBelanjaHariIni)})`);
      return;
    }
    metode = 'saldo';
    bayar = total; kembalian = 0;
  } else if(statusBayarKasir === 'belum_bayar'){
    namaPembeliHutang = (document.getElementById('fNamaHutang')?.value || '').trim();
    if(!namaPembeliHutang){ toast('Isi nama pembeli sebagai bukti hutang'); return; }
    metode = 'hutang';
    statusBayar = 'belum_bayar';
    bayar = 0; kembalian = 0;
  } else {
    bayar = angkaSaja(document.getElementById('fBayar')?.value);
    if(bayar < total){ toast('Jumlah bayar kurang dari total belanja'); return; }
    kembalian = bayar - total;
  }
  // validasi stok final (jumlahkan semua baris keranjang per produk, dalam pcs)
  const pcsDipakai = {};
  cart.forEach(c=>{ pcsDipakai[c.produkId] = (pcsDipakai[c.produkId]||0) + c.qty*c.pcsPerSatuan; });
  for(const produkId in pcsDipakai){
    const p = state.produk.find(x=>x.id===produkId);
    const namaCek = cart.find(c=>c.produkId===produkId)?.nama || '';
    if(!p || p.stok < pcsDipakai[produkId]){ toast(`Stok "${namaCek}" tidak cukup`); return; }
  }
  // commit LOKAL dulu (offline-first) — tampilan & stok langsung update, tidak nunggu server
  cart.forEach(c=>{
    const p = state.produk.find(x=>x.id===c.produkId);
    p.stok -= c.qty*c.pcsPerSatuan;
  });
  if(anggota) anggota.saldo -= total;
  const clientId = crypto.randomUUID ? crypto.randomUUID() : uid('cli');
  const trx = {
    id: uid('trx'), clientId, tipe:'jual', tanggal: new Date().toISOString(), lokasi: lokasiToko,
    anggotaId: anggota?anggota.id:null,
    anggotaNama: anggota ? anggota.nama : (namaPembeliHutang || null),
    items: cart.map(c=>({produkId:c.produkId, nama:c.nama, harga:c.harga, hargaBeli:c.hargaBeli||0, qty:c.qty, satuanLabel:c.satuanLabel||'', pcsPerSatuan:c.pcsPerSatuan})),
    total, metode, statusBayar, bayar, kembalian
  };
  state.transaksi.push(trx);
  saveDB();
  tampilkanStruk(trx);
  // masukkan ke antrean sinkron (dikirim ke Supabase begitu online, urutan terjaga)
  tambahTiketAntrean('transaksi_toko', {
    clientId,
    santriId: anggota ? anggota.id : null,
    metode: metode==='saldo' ? 'Saldo' : metode==='hutang' ? 'Hutang' : 'Tunai',
    // produkIdLokal (bukan produk_id final) sengaja disimpan apa adanya di sini — diterjemahkan
    // ke id asli Supabase nanti saat tiket ini benar-benar dikirim (lihat prosesTiket), supaya
    // tetap benar walau produknya sendiri juga baru saja dibuat offline dan belum sinkron.
    items: cart.map(c=>({ produkIdLokal: c.produkId, nama_produk: c.nama, harga_jual: c.harga, harga_beli: c.hargaBeli||0, qty: c.qty*(c.pcsPerSatuan||1) })),
    lokasi: lokasiToko,
    catatan: namaPembeliHutang || null,
    dicatatOleh: lastAuthEmail || null
  });
  cart = []; kasirAnggotaId = null; statusBayarKasir = 'lunas';
}
// "Tandai Lunas" & "Batalkan" perlu catatan lokal di state.transaksi supaya statusnya bisa langsung
// berubah di layar (optimistic update) & tetap "menang" saat cache server ditarik ulang (lihat
// daftarTransaksiToko). Transaksi yang DIBUAT DI PERANGKAT LAIN tidak otomatis ada di state.transaksi
// HP ini — tapi baris itu tetap ada & valid di cache server (daftarTransaksiToko), dan yang benar-benar
// dibutuhkan RPC di server (lunaskan_transaksi_toko/batalkan_transaksi_toko) cuma client_id, BUKAN baris
// lokal aslinya. Jadi kalau tidak ketemu di state.transaksi, import dulu dari cache server ke
// state.transaksi supaya aksinya tetap bisa dilakukan dari perangkat manapun.
function cariTransaksiLokal(idOrClientId){
  let t = state.transaksi.find(x=> x.id===idOrClientId || x.clientId===idOrClientId);
  if(t) return t;
  const dariServer = daftarTransaksiToko().find(x=> x.id===idOrClientId || x.clientId===idOrClientId);
  if(dariServer && dariServer.clientId){
    t = { ...dariServer };
    state.transaksi.push(t);
    return t;
  }
  return null;
}
function tandaiLunasHutang(id){
  const t = cariTransaksiLokal(id);
  if(!t){ toast('Transaksi tidak ditemukan'); return; }
  if(t.dibatalkan || t.metode!=='hutang' || t.statusBayar!=='belum_bayar') return;
  if(!confirm(`Tandai hutang ${t.anggotaNama||'pembeli ini'} sebesar ${rupiah(t.total)} sebagai sudah lunas?`)) return;
  t.statusBayar = 'lunas';
  t.lunasPada = new Date().toISOString();
  saveDB();
  tambahTiketAntrean('transaksi_lunas', { clientId: t.clientId });
  toast('Hutang ditandai lunas');
  if(document.getElementById('tabelRiwayatWrap')) renderTabelRiwayat();
  if(document.getElementById('labaCards')) renderLaporan();
}
function batalkanTransaksi(id){
  const t = cariTransaksiLokal(id);
  if(!t){ toast('Transaksi tidak ditemukan'); return; }
  if(t.dibatalkan) return;
  // Top Up & Tarik Tunai BUKAN milik kasir-toko — datanya cuma dibaca dari Aplikasi Keuangan
  // lewat sinkronisasi. Kasir-toko tidak boleh mengubah saldo lewat jalur ini sama sekali,
  // baik bikin baru maupun batalkan; satu-satunya cara kasir-toko boleh mengubah saldo adalah
  // lewat transaksi belanja (RPC belanja_toko). Pembatalan topup/tarik harus lewat Aplikasi Keuangan.
  if(t.tipe==='topup' || t.tipe==='tarik'){
    toast('Top Up & Tarik Tunai hanya bisa dibatalkan dari Aplikasi Keuangan');
    return;
  }
  let pesan = `Batalkan transaksi penjualan ini? Stok produk akan dikembalikan${t.metode==='saldo' ? ` dan saldo ${t.anggotaNama||'anggota'} akan dikembalikan sebesar ${rupiah(t.total)}` : t.metode==='hutang' ? ` dan catatan hutang ${t.anggotaNama||'pembeli'} akan dihapus` : ''}.`;
  if(!confirm(pesan)) return;

  let catatanGagal = [];
  t.items.forEach(i=>{
    const p = state.produk.find(x=>x.id===i.produkId);
    if(p) p.stok += i.qty*(i.pcsPerSatuan||1);
    else catatanGagal.push(`stok "${i.nama}" (produk sudah dihapus)`);
  });
  if(t.metode==='saldo' && t.anggotaId){
    const a = state.anggota.find(x=>x.id===t.anggotaId);
    if(a) a.saldo += t.total;
    else catatanGagal.push(`saldo anggota (sudah dihapus)`);
  }
  t.dibatalkan = true;
  t.dibatalkanPada = new Date().toISOString();
  saveDB();
  // Kirim pembatalan ke server (RPC batalkan_transaksi_toko) supaya stok & saldo di database ikut
  // dikembalikan, dan Aplikasi Keuangan/Wali Santri lihat data yang sama — bukan cuma berubah di HP ini.
  tambahTiketAntrean('transaksi_batal', { clientId: t.clientId });
  toast(catatanGagal.length ? `Transaksi dibatalkan. Tidak bisa memulihkan: ${catatanGagal.join(', ')}` : 'Transaksi dibatalkan');
  renderTabelRiwayat();
  const wrap = document.getElementById('tabelAnggotaWrap');
  if(wrap) renderTabelAnggota(document.getElementById('cariAnggota')?.value||'');
}

function renderTabelRiwayat(){
  const tgl = document.getElementById('filterTanggal')?.value;
  const tipe = document.getElementById('filterTipe')?.value;
  // Pakai daftarTransaksiToko() (cache dari server digabung transaksi lokal yang belum tersinkron)
  // untuk transaksi 'jual', bukan cuma state.transaksi — supaya transaksi hutang yang dibuat sebelum
  // data lokal HP ini pernah hilang/direset (tapi tetap ada di server) tetap tampil & bisa ditandai lunas.
  // Top up & tarik tunai saldo murni lokal (tidak disimpan di tabel transaksi_toko), jadi tetap dari state.transaksi.
  const nonJual = state.transaksi.filter(t=>t.tipe!=='jual');
  let list = [...daftarTransaksiToko(), ...nonJual].sort((a,b)=> new Date(a.tanggal) - new Date(b.tanggal));
  list.reverse();
  if(tgl) list = list.filter(t=>tanggalLokal(new Date(t.tanggal))===tgl);
  if(tipe) list = list.filter(t=>t.tipe===tipe);
  const wrap = document.getElementById('tabelRiwayatWrap');
  if(!wrap) return;
  if(!list.length){ wrap.innerHTML = `<div class="empty">Tidak ada transaksi untuk filter ini.</div>`; return; }
  wrap.innerHTML = `<table><thead><tr><th>Waktu</th><th>Anggota</th><th>Detail</th><th>Tipe</th><th class="num">Total</th><th></th></tr></thead><tbody>
    ${list.map(t=>`<tr style="${t.dibatalkan?'opacity:.55;':''}">
      <td>${new Date(t.tanggal).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
      <td>${t.anggotaNama||'Umum'}</td>
      <td style="color:var(--muted);font-size:12.5px;">${(t.tipe==='topup'||t.tipe==='tarik') ? (t.catatan||'-') : t.items.map(i=>`${i.nama} ${labelItemQty(i)}`).join(', ')}</td>
      <td>${tagTipeTransaksi(t)}</td>
      <td class="num">${rupiah(t.total)}</td>
      <td style="text-align:right;white-space:nowrap;">${t.dibatalkan ? '' : `${(t.metode==='hutang' && t.statusBayar==='belum_bayar') ? `<button class="btn btn-sm btn-primary" onclick="tandaiLunasHutang('${t.clientId||t.id}')">Tandai Lunas</button> ` : ''}${t.tipe==='jual' ? `<button class="btn btn-sm btn-danger" onclick="batalkanTransaksi('${t.clientId||t.id}')">Batalkan</button>` : ''}`}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

/* ============ KAS (ARUS KAS) ============
   Prinsip: Saldo Kas mencerminkan UANG FISIK di laci, beda dengan Laba yang sifatnya di atas kertas.
   - Beli stok TIDAK mengurangi laba (uang cuma pindah jadi barang), tapi TETAP mengurangi kas fisik.
   - Biaya operasional (listrik/sewa/gaji) mengurangi kas DAN mengurangi laba bersih.
   - Prive (ambil pribadi pemilik) mengurangi kas, tapi bukan kerugian usaha jadi tidak mengurangi laba.
   Kas otomatis dari transaksi kasir (penjualan tunai, top up, tarik tunai, pelunasan hutang) dihitung
   langsung dari state.transaksi — tidak disalin ke state.kasMutasi supaya tidak dobel catat.
   state.kasMutasi hanya untuk yang TIDAK lewat form Kasir: setor modal, beli stok, biaya operasional, prive, lainnya. */
const KATEGORI_KAS_MASUK = { modal:'Setor Modal', lainnya:'Kas Masuk Lainnya' };
const KATEGORI_KAS_KELUAR = { stok:'Beli Stok / Restock', operasional:'Biaya Operasional', prive:'Prive (Ambil Pribadi)', lainnya:'Kas Keluar Lainnya' };
function labelKategoriKas(arah, kategori){
  const map = arah==='masuk' ? KATEGORI_KAS_MASUK : KATEGORI_KAS_KELUAR;
  return map[kategori] || kategori;
}
// Gabungkan mutasi otomatis (dari transaksi kasir) + manual (state.kasMutasi) jadi satu daftar terurut,
// supaya "Saldo Kas Saat Ini" dan tabel mutasi selalu konsisten dengan satu sumber perhitungan.
function daftarMutasiKas(){
  const list = [];
  daftarTransaksiToko().forEach(t=>{
    if(t.dibatalkan) return;
    // Kas toko HANYA mencatat uang milik toko sendiri — dari penjualan (Produk/Laporan), baik dibayar tunai
    // maupun pakai saldo anggota (begitu saldo dipakai belanja, uangnya jadi milik toko).
    // Top Up dan Tarik Tunai SENGAJA tidak dihitung: itu cuma titipan/saldo anggota yang BELUM dibelanjakan,
    // bukan uang toko, jadi tidak menambah/mengurangi Kas maupun Modal sampai benar-benar dipakai belanja.
    if(t.tipe==='jual' && (t.metode==='tunai' || t.metode==='saldo')){
      list.push({ tanggal:t.tanggal, arah:'masuk', uraian:`Penjualan${t.metode==='saldo'?' (bayar saldo)':' tunai'}${t.anggotaNama?` — ${t.anggotaNama}`:''}`, jumlah:t.total, otomatis:true, refId:t.id });
    } else if(t.tipe==='jual' && t.metode==='hutang' && t.statusBayar==='lunas'){
      list.push({ tanggal:t.lunasPada||t.tanggal, arah:'masuk', uraian:`Pelunasan hutang — ${t.anggotaNama||'pembeli'}`, jumlah:t.total, otomatis:true, refId:t.id });
    }
  });
  state.kasMutasi.forEach(m=>{
    list.push({ id:m.id, tanggal:m.tanggal, arah:m.arah, uraian:labelKategoriKas(m.arah, m.kategori) + (m.catatan?` — ${m.catatan}`:''), jumlah:m.jumlah, otomatis:false, kategori:m.kategori });
  });
  return list.sort((a,b)=> new Date(a.tanggal) - new Date(b.tanggal));
}
// Saldo kas saat ini = kas awal + semua kas masuk − semua kas keluar (sepanjang waktu, tidak tergantung filter tanggal Laporan/Kas)
// Kalau cache v_ringkasan_toko sudah siap pakai (sudah pernah ditarik & tidak ada tiket menunggu),
// pakai angka dari server itu langsung — bukan hitung ulang di JS — supaya dijamin selaras dengan
// aplikasi lain. Kalau belum (baru pertama kali dibuka / lagi offline / masih ada tiket menunggu),
// fallback ke perhitungan lokal ini seperti sebelumnya.
function hitungSaldoKasSaatIni(){
  if(cacheRingkasanSiapPakai()) return state.ringkasanToko.saldoKas;
  return daftarMutasiKas().reduce((s,m)=> s + (m.arah==='masuk' ? m.jumlah : -m.jumlah), state.kasAwal||0);
}

function terapkanPresetKas(){
  const preset = document.getElementById('kasPreset').value;
  if(preset==='custom') return;
  const today = todayISO();
  let dari, sampai;
  if(preset==='harian'){ dari = today; sampai = today; }
  else if(preset==='mingguan'){ ({dari, sampai} = rangeMinggu(today)); }
  else if(preset==='bulanan'){ ({dari, sampai} = rangeBulan(today.slice(0,7))); }
  else { ({dari, sampai} = rangeTahun(today)); }
  document.getElementById('kasDari').value = dari;
  document.getElementById('kasSampai').value = sampai;
  renderKas();
}
function hitungNilaiStokSaatIni(){
  return state.produk.reduce((s,p)=>s+(p.hargaBeli||0)*p.stok,0);
}
// Laba kumulatif (gross, sepanjang waktu) dari SEMUA penjualan — tunai maupun hutang — karena barang sudah
// keluar dari stok begitu terjual, terlepas dari statusnya sudah dibayar tunai atau belum.
function hitungLabaKumulatif(){
  let omzet=0, modal=0;
  daftarItemTransaksiToko().forEach(i=>{
    if(i.dibatalkan) return;
    omzet += i.hargaJual*i.qty; modal += (i.hargaBeli||0)*i.qty;
  });
  return { omzetKumulatif: omzet, modalTerjual: modal, labaKumulatif: omzet-modal };
}
// Piutang = penjualan hutang yang belum lunas — barang sudah keluar dari stok tapi uangnya belum masuk kas,
// jadi ini "aset" tersendiri yang harus ikut dihitung, bukan kas maupun stok.
function hitungPiutangBelumLunas(){
  return daftarTransaksiToko().filter(t=>t.tipe==='jual' && t.metode==='hutang' && t.statusBayar==='belum_bayar' && !t.dibatalkan).reduce((s,t)=>s+t.total,0);
}
// Modal = Saldo Kas + Nilai Stok + Piutang − Laba Kumulatif + Biaya Operasional Kumulatif + Prive Kumulatif.
// Tidak perlu input manual (tidak ada "Modal Awal") — dihitung otomatis dari data yang sudah ada.
// Angka ini SEHARUSNYA STABIL dari waktu ke waktu (naik/turun jelas dari Setor Modal atau Prive yang kamu catat sendiri).
// Kalau tiba-tiba turun tanpa sebab yang jelas, itu tanda ada barang hilang/susut atau salah catat.
function renderCekModal(wrapId){
  const wrap = document.getElementById(wrapId || 'cekModalWrap');
  if(!wrap) return;
  // Sama seperti hitungSaldoKasSaatIni: kalau cache v_ringkasan_toko siap pakai, tampilkan langsung
  // angka dari server (dihitung sekali di sana, dipakai bersama aplikasi lain) — bukan hitung ulang di JS.
  let nilaiStok, saldoKas, piutang, labaKumulatif, biayaOperasionalKumulatif, priveKumulatif, modal;
  if(cacheRingkasanSiapPakai()){
    const r = state.ringkasanToko;
    nilaiStok = r.nilaiStok; saldoKas = r.saldoKas; piutang = r.piutang;
    labaKumulatif = r.labaKumulatif; biayaOperasionalKumulatif = r.biayaOperasionalKumulatif;
    priveKumulatif = r.priveKumulatif; modal = r.modalSaatIni;
  } else {
    nilaiStok = hitungNilaiStokSaatIni();
    saldoKas = hitungSaldoKasSaatIni();
    piutang = hitungPiutangBelumLunas();
    labaKumulatif = hitungLabaKumulatif().labaKumulatif;
    biayaOperasionalKumulatif = state.kasMutasi.filter(m=>m.arah==='keluar' && m.kategori==='operasional').reduce((s,m)=>s+m.jumlah,0);
    priveKumulatif = state.kasMutasi.filter(m=>m.arah==='keluar' && m.kategori==='prive').reduce((s,m)=>s+m.jumlah,0);
    modal = saldoKas + nilaiStok + piutang - labaKumulatif + biayaOperasionalKumulatif + priveKumulatif;
  }
  const baris = [
    ['Saldo Kas', saldoKas, true],
    ['+ Nilai Stok', nilaiStok, true],
    ['+ Piutang', piutang, piutang>0],
    ['− Total Laba', labaKumulatif, true],
    ['+ Biaya Operasional Kumulatif', biayaOperasionalKumulatif, biayaOperasionalKumulatif>0],
    ['+ Prive Kumulatif', priveKumulatif, priveKumulatif>0],
  ];
  wrap.innerHTML = `
    <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Modal = uang tunai + nilai barang di rak + piutang pelanggan, dikeluarkan dari laba yang sudah dihasilkan. Angka ini seharusnya <strong>stabil</strong> dari waktu ke waktu — kalau tiba-tiba turun sendiri (di luar Prive/Biaya Operasional yang kamu catat), itu tanda ada barang hilang/susut atau salah catat.</p>
    <table><tbody>
      ${baris.filter(b=>b[2]).map(b=>`<tr><td>${b[0]}</td><td class="num">${rupiah(b[1])}</td></tr>`).join('')}
      <tr style="border-top:1px solid var(--border);font-weight:700;"><td>Modal Saat Ini</td><td class="num">${rupiah(modal)}</td></tr>
    </tbody></table>
  `;
}
function renderKas(){
  const dariEl = document.getElementById('kasDari'), sampaiEl = document.getElementById('kasSampai');
  if(!dariEl) return;
  renderCekModal();
  const dari = dariEl.value, sampai = sampaiEl.value;
  const semua = daftarMutasiKas().filter(m=> tanggalLokal(new Date(m.tanggal))>=dari && tanggalLokal(new Date(m.tanggal))<=sampai);
  const totalMasuk = semua.filter(m=>m.arah==='masuk').reduce((s,m)=>s+m.jumlah,0);
  const totalKeluar = semua.filter(m=>m.arah==='keluar').reduce((s,m)=>s+m.jumlah,0);
  document.getElementById('kasCardsPeriode').innerHTML = `
    <div class="card"><div class="label">Kas Masuk (periode)</div><div class="value" style="color:var(--success);">${rupiah(totalMasuk)}</div></div>
    <div class="card"><div class="label">Kas Keluar (periode)</div><div class="value" style="color:var(--danger);">${rupiah(totalKeluar)}</div></div>
    <div class="card accent"><div class="label">Selisih (periode)</div><div class="value">${rupiah(totalMasuk-totalKeluar)}</div></div>
  `;
  const wrap = document.getElementById('kasMutasiWrap');
  const arahFilter = document.getElementById('kasArahFilter') ? document.getElementById('kasArahFilter').value : 'semua';
  const terfilter = arahFilter==='semua' ? semua : semua.filter(m=>m.arah===arahFilter);
  const list = [...terfilter].reverse();
  if(!list.length){ wrap.innerHTML = `<div class="empty">Tidak ada mutasi kas pada rentang tanggal ini.</div>`; return; }
  wrap.innerHTML = `<table><thead><tr><th>Waktu</th><th>Uraian</th><th class="num">Masuk</th><th class="num">Keluar</th><th></th></tr></thead><tbody>

      <td>${new Date(m.tanggal).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>

function terapkanPresetLaporan(){
  const preset = document.getElementById('labaPreset').value;
  if(preset==='custom') return;
  const today = todayISO();
  let dari, sampai;
  if(preset==='harian'){ dari = today; sampai = today; }
  else if(preset==='mingguan'){ ({dari, sampai} = rangeMinggu(today)); }
  else if(preset==='bulanan'){ ({dari, sampai} = rangeBulan(today.slice(0,7))); }
  else { ({dari, sampai} = rangeTahun(today)); }
  document.getElementById('labaDari').value = dari;
  document.getElementById('labaSampai').value = sampai;
  renderLaporan();

function hitungLaporan(dari, sampai){
  // Sumber data: cache v_transaksi_item (hasil tarik dari server, digabung dgn transaksi lokal yang
  // belum sempat tersinkron) — bukan menghitung ulang langsung dari state.transaksi lokal — supaya
  // rincian laba per produk & tren harian di Laporan selalu selaras dengan aplikasi lain.
  const itemList = daftarItemTransaksiToko().filter(i=> !i.dibatalkan && tanggalLokal(new Date(i.tanggal))>=dari && tanggalLokal(new Date(i.tanggal))<=sampai);
  let omzet=0, modal=0;
  let omzetTunai=0, modalTunai=0, omzetKredit=0, modalKredit=0;
  const perProduk = {};
  const perHariMap = {};
  // Siapkan semua tanggal dalam rentang lebih dulu (zona waktu lokal), supaya hari tanpa penjualan tetap tampil sebagai 0 di grafik
  const [dY,dM,dD] = dari.split('-').map(Number);
  const [aY,aM,aD] = sampai.split('-').map(Number);
  let cursor = new Date(dY, dM-1, dD);
  const akhir = new Date(aY, aM-1, aD);
  while(cursor <= akhir){
    const key = tanggalLokal(cursor);
    perHariMap[key] = { omzet:0, modal:0 };
    cursor.setDate(cursor.getDate()+1);
  }
  itemList.forEach(i=>{
    const isKredit = i.metode==='hutang';
    const tgl = tanggalLokal(new Date(i.tanggal));
    if(!perHariMap[tgl]) perHariMap[tgl] = { omzet:0, modal:0 };
    const beli = (i.hargaBeli||0)*i.qty;
    const jual = i.hargaJual*i.qty;
    omzet += jual; modal += beli;
    if(isKredit){ omzetKredit += jual; modalKredit += beli; } else { omzetTunai += jual; modalTunai += beli; }
    if(!perProduk[i.namaProduk]) perProduk[i.namaProduk] = {nama:i.namaProduk, qty:0, omzet:0, modal:0, omzetTunai:0, modalTunai:0, omzetKredit:0, modalKredit:0};
    perProduk[i.namaProduk].qty += i.qty;
    perProduk[i.namaProduk].omzet += jual;
    perProduk[i.namaProduk].modal += beli;
    if(isKredit){ perProduk[i.namaProduk].omzetKredit += jual; perProduk[i.namaProduk].modalKredit += beli; }
    else { perProduk[i.namaProduk].omzetTunai += jual; perProduk[i.namaProduk].modalTunai += beli; }
    perHariMap[tgl].omzet += jual;
    perHariMap[tgl].modal += beli;
  });
  const perHari = Object.keys(perHariMap).sort().map(k=>{
    const d = perHariMap[k];
    return { tanggal:k, omzet:d.omzet, modal:d.modal, laba:d.omzet-d.modal, label:k.slice(8,10)+'/'+k.slice(5,7) };
  });
  const rows = Object.values(perProduk).map(r=>({...r, laba:r.omzet-r.modal, labaTunai:r.omzetTunai-r.modalTunai, labaKredit:r.omzetKredit-r.modalKredit})).sort((a,b)=>b.laba-a.laba);
  // Daftar hutang tetap butuh data per-transaksi (bukan per-item) — pakai daftarTransaksiToko() (cache
  // transaksi_toko digabung transaksi lokal yang belum tersinkron) supaya tombol "Tandai Lunas" tetap jalan.
  const listTrx = daftarTransaksiToko().filter(t=>t.tipe==='jual' && !t.dibatalkan && tanggalLokal(new Date(t.tanggal))>=dari && tanggalLokal(new Date(t.tanggal))<=sampai);
  const listHutang = listTrx.filter(t=>t.metode==='hutang');
  const hutangLunas = listHutang.filter(t=>t.statusBayar==='lunas');
  // Piutang belum lunas sengaja TIDAK dibatasi rentang tanggal laporan (dari/sampai) — piutang adalah
  // saldo berjalan yang menumpuk sampai dibayar, bukan angka per-periode. Kalau dibatasi tanggal, hutang
  // dari hari-hari sebelumnya jadi "hilang" dari panel ini walau belum lunas & tombol Tandai Lunas jadi
  // tidak bisa diakses dari Laporan untuk transaksi lama.
  const hutangBelumLunas = [...daftarTransaksiToko().filter(t=>t.tipe==='jual' && !t.dibatalkan && t.metode==='hutang' && t.statusBayar==='belum_bayar')].reverse();
  const totalHutangBelumLunas = hutangBelumLunas.reduce((s,t)=>s+t.total,0);
  const labaTunai = omzetTunai - modalTunai;
  const labaKredit = omzetKredit - modalKredit;
  // Biaya operasional (listrik/sewa/gaji dll) mengurangi laba bersih. Beli stok & prive TIDAK ikut di sini
  // karena bukan kerugian usaha — itu cuma perpindahan uang jadi barang / pengambilan modal pemilik (lihat halaman Kas).
  const biayaOperasional = state.kasMutasi.filter(m=> m.arah==='keluar' && m.kategori==='operasional' && tanggalLokal(new Date(m.tanggal))>=dari && tanggalLokal(new Date(m.tanggal))<=sampai).reduce((s,m)=>s+m.jumlah,0);
  const laba = omzet-modal;
  return { omzet, modal, laba, labaTunai, labaKredit, biayaOperasional, labaBersih: laba-biayaOperasional, jumlahTransaksi: listTrx.length, rows, perHari, hutangBelumLunas, hutangLunas, totalHutangBelumLunas };
}
function gambarGrafikLaporan(perHari){
  const canvas = document.getElementById('grafikLaporan');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  if(!perHari || !perHari.length){
    canvas.style.width = '100%'; canvas.style.height = '60px';
    canvas.width = canvas.clientWidth || 300; canvas.height = 60;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  const jumlahHari = perHari.length;
  const lebarPerBar = jumlahHari<=14 ? 40 : jumlahHari<=31 ? 24 : 10;
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = Math.max(canvas.parentElement.clientWidth || 300, jumlahHari*lebarPerBar);
  const cssHeight = 200;
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  canvas.width = Math.round(cssWidth*dpr);
  canvas.height = Math.round(cssHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssWidth,cssHeight);

  const cs = getComputedStyle(document.documentElement);
  const warnaOmzet = cs.getPropertyValue('--accent').trim() || '#B8862F';
  const warnaLaba = cs.getPropertyValue('--success').trim() || '#3E6B4F';
  const warnaMuted = cs.getPropertyValue('--muted').trim() || '#6E6858';
  const warnaBorder = cs.getPropertyValue('--border').trim() || '#E2D8BE';

  const maxVal = Math.max(1, ...perHari.map(d=>Math.max(d.omzet, d.laba, 0)));
  const tampilkanLabel = jumlahHari <= 31;
  const padTop = 10, padBottom = tampilkanLabel ? 26 : 8, padSide = 2;
  const chartH = cssHeight - padTop - padBottom;
  const groupW = (cssWidth - padSide*2) / jumlahHari;
  const barW = Math.max(2, Math.min(14, groupW/2 - 3));

  ctx.strokeStyle = warnaBorder;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, padTop+chartH+0.5);
  ctx.lineTo(cssWidth, padTop+chartH+0.5);
  ctx.stroke();

  perHari.forEach((d,i)=>{
    const cx = padSide + i*groupW + groupW/2;
    const hOmzet = (d.omzet/maxVal)*chartH;
    const hLaba = (d.laba/maxVal)*chartH;
    ctx.fillStyle = warnaOmzet;
    ctx.fillRect(cx-barW-1, padTop+chartH-hOmzet, barW, hOmzet);
    ctx.fillStyle = warnaLaba;
    ctx.fillRect(cx+1, padTop+chartH-hLaba, barW, hLaba);
    if(tampilkanLabel){
      ctx.fillStyle = warnaMuted;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, cx, cssHeight-10);
    }
  });
}
// Grafik batang horizontal: produk dengan omzet tertinggi pada rentang tanggal yang dipilih di Laporan.
function gambarGrafikProdukLaporan(rows){
  const canvas = document.getElementById('grafikProdukLaporan');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.parentElement.clientWidth || 300;
  const rowH = 30;
  const cssHeight = Math.max(40, rows.length*rowH + 6);
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  canvas.width = Math.round(cssWidth*dpr);
  canvas.height = Math.round(cssHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssWidth,cssHeight);
  if(!rows.length) return;

  const cs = getComputedStyle(document.documentElement);
  const warnaAccent = cs.getPropertyValue('--accent').trim() || '#B8862F';
  const warnaText = cs.getPropertyValue('--text').trim() || '#22281F';
  const warnaMuted = cs.getPropertyValue('--muted').trim() || '#6E6858';

  const labelW = Math.min(120, cssWidth*0.32);
  const valueAreaW = Math.max(40, cssWidth - labelW - 90);
  const maxVal = Math.max(1, ...rows.map(r=>r.omzet));

  rows.forEach((r,i)=>{
    const y = i*rowH + 5;
    const barH = rowH - 12;
    let nama = r.nama.length > 15 ? r.nama.slice(0,14)+'…' : r.nama;
    ctx.fillStyle = warnaText;
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(nama, 0, y+barH/2);
    const barW = Math.max(2, (r.omzet/maxVal)*valueAreaW);
    ctx.fillStyle = warnaAccent;
    ctx.fillRect(labelW, y, barW, barH);
    ctx.fillStyle = warnaMuted;
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText(rupiah(r.omzet), labelW+barW+6, y+barH/2);
  });
}
function renderLaporan(){
  const dariEl = document.getElementById('labaDari'), sampaiEl = document.getElementById('labaSampai');
  if(!dariEl) return;
  const dari = dariEl.value, sampai = sampaiEl.value;

  renderCekModal('cekModalWrapLaporan');
  document.getElementById('labaCards').innerHTML = `
    <div class="card"><div class="label">Omzet</div><div class="value">${rupiah(r.omzet)}</div></div>

  `;
  gambarGrafikLaporan(r.perHari);
  const produkChartWrap = document.getElementById('produkTerlarisChartWrap');
  if(produkChartWrap){
    if(r.rows.length){
      const topProdukOmzet = [...r.rows].sort((a,b)=>b.omzet-a.omzet).slice(0,8);
      produkChartWrap.innerHTML = `<div class="chart-scroll"><canvas id="grafikProdukLaporan"></canvas></div>`;
      gambarGrafikProdukLaporan(topProdukOmzet);
    } else {
      produkChartWrap.innerHTML = `<div class="empty">Tidak ada penjualan pada rentang tanggal ini.</div>`;
    }
  }
  const wrap = document.getElementById('labaTabelWrap');
  if(!r.rows.length){
    wrap.innerHTML = `<div class="empty">Tidak ada penjualan pada rentang tanggal ini.</div>`;
  } else {
    const totalQty = r.rows.reduce((s,x)=>s+x.qty,0);
    wrap.innerHTML = `<table><thead><tr><th>Produk</th><th class="num">Terjual</th><th class="num">Omzet</th><th class="num">Modal</th><th class="num">Laba Tunai</th><th class="num">Laba Kredit</th><th class="num">Total Laba</th></tr></thead><tbody>
      ${r.rows.map(x=>`<tr><td>${x.nama}</td><td class="num">${x.qty}</td><td class="num">${rupiah(x.omzet)}</td><td class="num">${rupiah(x.modal)}</td><td class="num">${rupiah(x.labaTunai)}</td><td class="num" style="color:var(--danger);">${rupiah(x.labaKredit)}</td><td class="num" style="color:var(--success);font-weight:600;">${rupiah(x.laba)}</td></tr>`).join('')}
    </tbody>
    <tfoot><tr style="font-weight:700;border-top:2px solid var(--primary-dark);">
      <td>Total</td>
      <td class="num">${totalQty}</td>
      <td class="num">${rupiah(r.omzet)}</td>
      <td class="num">${rupiah(r.modal)}</td>
      <td class="num">${rupiah(r.labaTunai)}</td>
      <td class="num" style="color:var(--danger);">${rupiah(r.labaKredit)}</td>
      <td class="num" style="color:var(--success);">${rupiah(r.laba)}</td>
    </tr></tfoot>
    </table>`;

  const wrapHutang = document.getElementById('hutangTabelWrap');
  if(wrapHutang){

      wrapHutang.innerHTML = `<div class="empty">Tidak ada pembelian yang belum dibayar.</div>`;
    } else {
      wrapHutang.innerHTML = `<table><thead><tr><th>Tanggal</th><th>Nama Pembeli</th><th>Detail</th><th class="num">Total</th><th></th></tr></thead><tbody>
        ${r.hutangBelumLunas.map(t=>`<tr>
          <td>${new Date(t.tanggal).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>

      </table>`;
    }

        <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Masuk sebagai <strong>${lastAuthEmail || '-'}</strong>. Dashboard, Kasir, Anggota, dan Produk cukup login sekali per sesi. Riwayat, Kas, Laporan, dan Pengaturan (halaman ini) minta login ulang setiap kali dibuka.</p>
        <p style="font-size:12.5px;color:var(--muted);margin:-6px 0 12px;">Akun dibuat dan dikelola oleh admin pusat lewat Supabase, bukan dari halaman ini. Kalau lupa password, hubungi admin pusat.</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Lokasi Toko Ini</div>
      <div class="panel-body">
        <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Tiap toko fisik (device ini) mewakili satu lokasi — stok barang & laporan dipisah per lokasi. Pilih sesuai toko tempat device ini dipakai.</p>
        <div class="field">
          <label>Lokasi</label>

            <option value="Sekolah" ${lokasiToko==='Sekolah'?'selected':''}>Toko Sekolah</option>
          </select>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Kas Awal</div>
      <div class="panel-body">
        <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Uang TUNAI yang dipegang toko sebelum mulai memakai halaman Kas — jangan campur nilai barang/stok di sini, ini murni yang bisa dipegang fisik. Diisi sekali saja sebagai titik awal perhitungan; ubah kalau perlu koreksi. Otomatis ikut tercadangkan ke server begitu ada koneksi internet.</p>
        <div class="field"><label>Nominal Kas Awal (Tunai)</label><input id="fKasAwal" type="text" inputmode="numeric" value="${state.kasAwal||0}"></div>
        <button class="btn btn-primary" onclick="simpanKasAwal()">Simpan Kas Awal</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Cadangkan Data</div>
      <div class="panel-body">
        <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Produk, transaksi, santri, kas awal, dan mutasi kas sudah tercadangkan otomatis ke server. Unduh cadangan .json ini tetap disarankan sebagai salinan tambahan tersendiri.</p>
        <button class="btn btn-primary" onclick="exportData()">⬇ Unduh Cadangan (.json)</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Cadangan Otomatis Harian <span class="badge-count">jam 23:45</span></div>
      <div class="panel-body">
        <p style="font-size:13.5px;color:var(--muted);margin-top:0;">Selama aplikasi ini terbuka di perangkat, data akan dicadangkan otomatis tiap hari sekitar jam 23:45 dan disimpan di sini (7 hari terakhir). Kalau aplikasi tertutup persis di jam itu, cadangan susulan akan dibuat begitu aplikasi dibuka lagi.</p>
        <div id="daftarAutoBackup"></div>
        <button class="btn" style="margin-top:10px;" onclick="simpanBackupOtomatis(true); toast('Cadangan otomatis disimpan sekarang')">Buat Cadangan Sekarang</button>

    </div>
    <div class="panel">
      <div class="panel-head">Pulihkan Data</div>
      <div class="panel-body">
        <input type="file" id="fileImport" accept="application/json">
        <p class="hint">Memulihkan data akan menimpa seluruh data yang ada saat ini.</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Zona Berbahaya</div>
      <div class="panel-body">
        <button class="btn btn-danger" onclick="resetData()">Hapus Semua Data</button>
      </div>
    </div>
  `;
};
function simpanKasAwal(){
  const nominal = angkaSaja(document.getElementById('fKasAwal').value);
  state.kasAwal = nominal;
  saveDB(); toast('Kas awal disimpan'); renderPage('pengaturan');
  tambahTiketAntrean('kas_awal_update', { lokasi: lokasiToko, kasAwal: state.kasAwal||0, modalAwal: state.modalAwal||0, dicatatOleh: lastAuthEmail || null });
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-kasir-toko-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Cadangan diunduh');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.anggota || !data.produk || !data.transaksi) throw new Error('format tidak valid');
      if(!confirm('Ini akan menimpa semua data saat ini. Lanjutkan?')) return;
      state = data;
      if(typeof state.kasAwal !== 'number') state.kasAwal = 0;
      if(typeof state.modalAwal !== 'number') state.modalAwal = 0;
      if(!state.kasMutasi) state.kasMutasi = [];
      saveDB(); toast('Data berhasil dipulihkan'); goPage('dashboard');
    }catch(err){ toast('Gagal memulihkan: file tidak valid'); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('Hapus SEMUA data anggota, produk, dan riwayat? Tindakan ini tidak bisa dibatalkan.')) return;
  if(!confirm('Yakin? Pertimbangkan unduh cadangan terlebih dahulu.')) return;
  // Pakai bentukAwalState() (bukan object manual di sini) supaya field cache hasil sinkron server
  // (transaksiTokoCache, transaksiItemCache, ringkasanToko) ikut kosong juga — sebelumnya field ini
  // terlewat sehingga data hasil tarikan dari Supabase masih nyangkut walau tombol ini sudah diklik.
  state = bentukAwalState();
  saveDB(); toast('Semua data dihapus'); goPage('dashboard');
}

/* ============ BACKUP OTOMATIS HARIAN (tersimpan di perangkat ini, target jam 23:45) ============
   Catatan penting: browser/PWA tidak bisa menjalankan kode saat aplikasinya benar-benar tertutup.
   Jadi ini bekerja dengan cara: selama aplikasi terbuka, dicek tiap menit — begitu jam menunjukkan
   23:45 atau lebih dan hari itu belum ada cadangan, langsung disimpan otomatis. Kalau aplikasi
   kebetulan tertutup persis di jam segitu, saat dibuka lagi keesokan harinya akan langsung dibuatkan
   cadangan susulan dari data yang ada, supaya tidak ada hari yang benar-benar terlewat. */
const JAM_AUTO_BACKUP = 23, MENIT_AUTO_BACKUP = 45;
function tanggalLokal(d){
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Bantuan hitung rentang tanggal untuk preset periode (Harian/Mingguan/Bulanan/Tahunan) di Laporan & Riwayat Anggota.
function rangeMinggu(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = dt.getDay(); // 0=Minggu..6=Sabtu
  const diffKeSenin = (dow===0 ? -6 : 1-dow);
  const senin = new Date(dt); senin.setDate(dt.getDate()+diffKeSenin);
  const minggu = new Date(senin); minggu.setDate(senin.getDate()+6);
  return { dari: tanggalLokal(senin), sampai: tanggalLokal(minggu) };
}
function rangeBulan(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const dari = `${y}-${String(m).padStart(2,'0')}-01`;
  const hariTerakhir = new Date(y, m, 0).getDate();
  const sampai = `${y}-${String(m).padStart(2,'0')}-${String(hariTerakhir).padStart(2,'0')}`;
  return { dari, sampai };
}
function rangeTahun(dateStr){
  const y = dateStr.split('-')[0];
  return { dari: `${y}-01-01`, sampai: `${y}-12-31` };
}
// Cache di memori supaya kode lain tetap bisa baca daftar cadangan secara langsung (synchronous),
// isinya dimuat dari IndexedDB oleh bootApp() saat aplikasi pertama dibuka.
let autoBackupList = [];
function loadAutoBackupList(){ return autoBackupList; }
function saveAutoBackupList(list){
  autoBackupList = list;
  idbSet(AUTO_BACKUP_KEY, list).catch(e=> console.error('Gagal menyimpan cadangan otomatis', e));
}
function simpanBackupOtomatis(paksa){
  const list = loadAutoBackupList();
  const tgl = tanggalLokal();
  const idx = list.findIndex(b=>b.tanggal===tgl);
  if(idx !== -1){
    if(!paksa) return;
    list[idx] = { tanggal: tgl, waktu: new Date().toISOString(), data: state };
  } else {
    list.push({ tanggal: tgl, waktu: new Date().toISOString(), data: state });
    while(list.length > 7) list.shift(); // simpan maksimal 7 cadangan harian terakhir
  }
  saveAutoBackupList(list);
  const wrap = document.getElementById('daftarAutoBackup');
  if(wrap) renderDaftarAutoBackup();
}
function cekBackupOtomatis(){
  const now = new Date();
  const tgl = tanggalLokal(now);
  const list = loadAutoBackupList();
  if(list.some(b=>b.tanggal===tgl)) return;
  const sudahLewatJam = now.getHours() > JAM_AUTO_BACKUP || (now.getHours()===JAM_AUTO_BACKUP && now.getMinutes() >= MENIT_AUTO_BACKUP);
  const terakhir = list[list.length-1];
  const lamaTakBackup = !terakhir || (now - new Date(terakhir.waktu)) > 24*3600*1000;
  if(sudahLewatJam || lamaTakBackup) simpanBackupOtomatis();
}
function unduhAutoBackup(tgl){
  const list = loadAutoBackupList();
  const b = list.find(x=>x.tanggal===tgl); if(!b) return;
  const blob = new Blob([JSON.stringify(b.data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-otomatis-kasir-toko-${tgl}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function pulihkanAutoBackup(tgl){
  const list = loadAutoBackupList();
  const b = list.find(x=>x.tanggal===tgl); if(!b) return;
  if(!confirm(`Pulihkan data ke kondisi cadangan otomatis tanggal ${tgl}? Data saat ini akan tertimpa.`)) return;
  state = b.data; saveDB(); toast(`Data dipulihkan ke cadangan ${tgl}`); goPage('dashboard');
}
function renderDaftarAutoBackup(){
  const wrap = document.getElementById('daftarAutoBackup');
  if(!wrap) return;
  const list = [...loadAutoBackupList()].reverse();
  wrap.innerHTML = list.length ? list.map(b=>`
    <div class="cart-item">
      <div class="nm">${b.tanggal}<br><span style="color:var(--muted);font-size:11.5px;">${new Date(b.waktu).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-sm" onclick="unduhAutoBackup('${b.tanggal}')">⬇ Unduh</button>
        <button class="btn btn-sm btn-danger" onclick="pulihkanAutoBackup('${b.tanggal}')">Pulihkan</button>
      </div>
    </div>
  `).join('') : `<div class="empty" style="padding:10px 0;">Belum ada cadangan otomatis.</div>`;
}

/* ============ PAGE EVENT BINDING ============ */
function attachPageEvents(name){
  if(name==='anggota'){
    renderTabelAnggota('');
    document.getElementById('cariAnggota').addEventListener('input', e=>renderTabelAnggota(e.target.value));
    document.getElementById('btnScanAnggotaCari').addEventListener('click', ()=>{
      openCameraScan(kode=>{
        const cariEl = document.getElementById('cariAnggota');
        if(cariEl) cariEl.value = kode;
        renderTabelAnggota(kode);
        const a = state.anggota.find(x=>x.nomorInduk && x.nomorInduk.toUpperCase()===kode.trim().toUpperCase());
        if(a) toast(`Ditemukan: ${a.nama}`);
        else toast('Barcode tidak cocok dengan anggota manapun');
      }, { title:'Scan Kode Anggota' });
    });
  }
  if(name==='produk'){
    renderTabelProduk('');
    document.getElementById('cariProduk').addEventListener('input', e=>renderTabelProduk(e.target.value));
    document.getElementById('btnTambahProduk').addEventListener('click', openTambahProduk);
  }
  if(name==='kasir'){
    renderProdukGrid('');
    renderCart();
    pilihPembeli(null);
    setTimeout(focusScanKasir, 50);
    sesuaikanTinggiKasir();
    window.removeEventListener('resize', sesuaikanTinggiKasir);
    window.addEventListener('resize', sesuaikanTinggiKasir);
    window.removeEventListener('orientationchange', sesuaikanTinggiKasir);
    window.addEventListener('orientationchange', sesuaikanTinggiKasir);
    if(window.visualViewport){
      window.visualViewport.removeEventListener('resize', sesuaikanTinggiKasir);
      window.visualViewport.addEventListener('resize', sesuaikanTinggiKasir);
    }
    document.getElementById('cariProdukKasir').addEventListener('input', e=>{
      const q = e.target.value.trim();
      const barcodeMatch = state.produk.find(p=>p.barcode && p.barcode===q);
      if(barcodeMatch){ e.target.value=''; tambahViaBarcode(barcodeMatch.barcode); renderProdukGrid(''); return; }
      const anggotaMatch = state.anggota.find(a=>a.nomorInduk && a.nomorInduk===q.toUpperCase());
      if(anggotaMatch){ e.target.value=''; pilihPembeli(anggotaMatch.id); toast(`Pembeli: ${anggotaMatch.nama} · Saldo ${rupiah(anggotaMatch.saldo)}`); renderProdukGrid(''); return; }
      renderProdukGrid(q);
    });
    document.getElementById('btnScanProduk').addEventListener('click', ()=>{
      openCameraScan(v=>{
        tambahViaBarcode(v);
        renderProdukGrid(document.getElementById('cariProdukKasir').value.trim());
      }, { continuous:true, title:'Scan Barcode Produk' });
    });
    document.getElementById('btnProses').addEventListener('click', prosesTransaksi);
    attachFormatRibuan('fBayar', updateSisaKasir);
    const cariPembeli = document.getElementById('cariPembeli');
    const dropdown = document.getElementById('pembeliDropdown');
    document.getElementById('btnScanAnggota').addEventListener('click', ()=>{
      openCameraScan(v=>{
        const a = state.anggota.find(x=>x.nomorInduk && x.nomorInduk===v.trim().toUpperCase());
        if(a){ pilihPembeli(a.id); toast(`Terpindai: ${a.nama} · Saldo ${rupiah(a.saldo)}`); }
        else toast('Anggota dengan barcode ini tidak ditemukan');
      }, { title:'Scan Kartu Anggota' });
    });
    cariPembeli.addEventListener('input', e=>{
      const q = e.target.value.toLowerCase();
      kasirAnggotaId = null;
      if(!q){ dropdown.classList.remove('show'); document.getElementById('pembeliInfo').innerHTML = `<p style="font-size:12.5px;color:var(--muted);margin:6px 0 12px;">Mode: <strong>Umum / Tunai</strong></p>`; return; }
      const scanMatch = state.anggota.find(a=>a.nomorInduk && a.nomorInduk.toLowerCase()===q);
      if(scanMatch){ pilihPembeli(scanMatch.id); toast(`Terpindai: ${scanMatch.nama}`); return; }
      const matches = state.anggota.filter(a=>a.nama.toLowerCase().includes(q) || (a.nomorInduk||'').toLowerCase().includes(q)).slice(0,8);
      if(!matches.length){ dropdown.innerHTML = `<div style="color:var(--muted);">Tidak ditemukan</div>`; dropdown.classList.add('show'); return; }
      dropdown.innerHTML = matches.map(a=>`<div onclick="pilihPembeli('${a.id}')">${a.nama}${a.nomorInduk?` <span style="color:var(--muted);font-size:11px;">(${a.nomorInduk})</span>`:''} <span style="color:var(--muted);font-size:11.5px;">· ${rupiah(a.saldo)}</span></div>`).join('');
      dropdown.classList.add('show');
    });
    document.addEventListener('click', function hideDropdown(e){
      if(!e.target.closest('.anggota-select-search')) dropdown.classList.remove('show');
    });
  }
  if(name==='riwayat'){
    renderTabelRiwayat();
    document.getElementById('filterTanggal').addEventListener('change', renderTabelRiwayat);
    document.getElementById('filterTipe').addEventListener('change', renderTabelRiwayat);
  }
  if(name==='kas'){
    renderKas();
    document.getElementById('btnTerapkanKas').addEventListener('click', renderKas);
    document.getElementById('btnKasMasuk').addEventListener('click', openKasMasuk);
    document.getElementById('btnKasKeluar').addEventListener('click', openKasKeluar);
    document.getElementById('kasArahFilter').addEventListener('change', renderKas);
    const resetKePresetKas = ()=>{ const p = document.getElementById('kasPreset'); if(p) p.value = 'custom'; };
    document.getElementById('kasDari').addEventListener('input', resetKePresetKas);
    document.getElementById('kasSampai').addEventListener('input', resetKePresetKas);
  }
  if(name==='laporan'){
    renderLaporan();
    document.getElementById('btnTerapkanLaba').addEventListener('click', renderLaporan);
    const resetKePreset = ()=>{ const p = document.getElementById('labaPreset'); if(p) p.value = 'custom'; };
    document.getElementById('labaDari').addEventListener('input', resetKePreset);
    document.getElementById('labaSampai').addEventListener('input', resetKePreset);
  }
  if(name==='pengaturan'){
    renderDaftarAutoBackup();
    attachFormatRibuan('fKasAwal');
    document.getElementById('fileImport').addEventListener('change', e=>{
      if(e.target.files[0]) importData(e.target.files[0]);
    });
  }
}

/* ============ INIT ============ */
async function bootApp(){
  try{
    await migrasiDariLocalStorage(); // pindahkan data lama dari localStorage sekali saja, kalau ada
    state = await loadDB();
    autoBackupList = (await idbGet(AUTO_BACKUP_KEY)) || [];
    await muatAntrean();
    await muatLokasiToko();
  }catch(e){
    console.error('Gagal memuat data dari IndexedDB', e);
    toast('Gagal memuat data tersimpan — cek penyimpanan perangkat');
  }
  goPage('dashboard');
  perbaruiBadgeStokMenipis();
  perbaruiBadgeAntrean();
  cekBackupOtomatis();
  setInterval(cekBackupOtomatis, 60*1000); // cek tiap menit selama aplikasi terbuka
  // Coba sinkron antrean lama dulu (urutannya harus duluan), baru tarik data produk terbaru dari server
  await cobaSinkronSekarang();
  if(await muatProdukDariSupabase()){
    if(document.querySelector('.nav button[data-page="produk"].active')) renderPage('produk');
  }
  await muatSantriDariSupabase();
  await muatKasDariSupabase();
  await sinkronRingkasanDanRiwayatToko();
  window.addEventListener('online', ()=>{
    toast('Koneksi kembali — menyinkronkan data...');
    muatProdukDariSupabase(); muatSantriDariSupabase(); muatKasDariSupabase();
    sinkronRingkasanDanRiwayatToko();
  });
}
bootApp();

/* ============ PWA: DAFTARKAN SERVICE WORKER ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.error('Gagal mendaftarkan service worker', err);
    });
  });
  // Saat versi baru aplikasi sudah aktif menggantikan yang lama, muat ulang otomatis
  // supaya perubahan langsung terlihat tanpa harus hapus cache manual.
  let sudahReload = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(sudahReload) return;
    sudahReload = true;
    window.location.reload();
  });
}
</script>
